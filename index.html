<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="application/json" id="estado">{"metaMes":250000,"lancamentos":[]}</script>
<script id="app-script">
(function(){
  "use strict";


  /* ============================================================
     CONFIGURAÇÃO
     ------------------------------------------------------------
     META_MES       meta do mês em reais. Dá para trocar pelo painel, no
                    quadro "Meta do mês" — o que for salvo ali manda nisto.
     CUSTO_MES      custo total do mês em reais; dele sai o lucro projetado.
                    0 = sem custo informado, e o lucro não aparece. Também dá
                    para trocar no quadro "Meta do mês". A TV só lê daqui.
     FERIADOS_EXTRAS  dias sem expediente além dos nacionais, carnaval e
                    Corpus Christi, como ["2026-11-30"]
     API_URL        (opcional) endpoint que guarda o estado.
                    Vazio  -> cada navegador guarda o seu (localStorage)
                    Preenchido -> todo mundo vê o mesmo número
     API_TOKEN      (opcional) enviado como "Authorization: Bearer ..."
     SYNC_SEGUNDOS  de quanto em quanto tempo busca o que os outros lançaram
     CSV_RECEITAS   (opcional) URL do CSV publicado da conciliação bancária.
                    Preenchido -> as receitas entram sozinhas, com o nome de
                    quem pagou, e ninguém precisa lançar uma a uma.
     CSV_A_RECEBER  (opcional) URL do CSV publicado da carteira: o que já está
                    emitido e ainda não caiu, com data de vencimento. A
                    conciliação só sabe de dinheiro que entrou — sem esta aba o
                    painel não tem como dizer quanto ainda vem.
     CSV_SEGUNDOS   de quanto em quanto tempo relê as planilhas

     Contrato da API (dois métodos na mesma URL):
       GET  -> {"metaMes":250000,"lancamentos":[ ... ]}   (ou só o array)
       POST -> recebe {"metaMes":250000,"lancamentos":[ ... ]} e grava tudo
     Cada lançamento: {id, ts, dia:"AAAA-MM-DD", hora, min, valor, vendedor, cliente}
     (basta devolver id/ts/valor — dia, hora e min são deduzidos do ts)
     ============================================================ */
  var CONFIG = {
    META_MES: 250000,
    CUSTO_MES: 0,
    FERIADOS_EXTRAS: [],
    API_URL: "",
    API_TOKEN: "",
    SYNC_SEGUNDOS: 15,
    CSV_RECEITAS: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUoDMOQjexi5qaS6f9GhYnmZebauOguIJoym1n9TdS3ITBAwdyEcCAnOKbSUJLsQ5nFdQocDAtSxOP/pub?gid=818195436&single=true&output=csv",
    CSV_A_RECEBER: "",
    CSV_SEGUNDOS: 300
  };
  /* ====== estado ====== */
  var META_MES_PADRAO = CONFIG.META_MES || 250000;
  var estado = lerEstado();
  var somenteLeitura = false, avisoOk = false;
  var festaVista = false, tela = "painel", filtro = "", diasAbertos = {}, avisoHist = "";
  var avisoMeta = "", avisoMetaOk = false, recarregarMetas = false;
  var atualizando = false;
  /* ?tv na URL: tela de parede — nada em que clicar, tudo lido de longe */
  var modoTV = /(^|[?&#])tv(?:[=&#]|$)/i.test(location.search + location.hash);
  if(modoTV) somenteLeitura = true;
  /* a festa mora no localStorage, não no sessionStorage: na TV o PC reinicia
     toda manhã, e os fogos voltavam a explodir todo dia do mês já batido */
  var festaMes = "";
  try { festaMes = localStorage.getItem("festa-vista") || ""; } catch(e){}
  try { tela = sessionStorage.getItem("tela") === "historico" ? "historico" : "painel"; } catch(e){}
  /* festaVista só é resolvido lá no ciclo, no fim do arquivo: FMT (o fuso de
     São Paulo) nasce depois deste bloco, e hojeSP() aqui estourava. O try/catch
     que existia engolia a exceção em silêncio — e o efeito era a festa
     recomeçando do zero a cada vez que a página abria. */

  function lerEstado(){
    try {
      var s = JSON.parse(document.getElementById("estado").textContent);
      if(!s || typeof s !== "object") throw 0;
      if(!Array.isArray(s.lancamentos)) s.lancamentos = [];
      /* ocultos eram as linhas da planilha apagadas pelo painel, que não se
         apaga mais: o campo deixa de ser lido e some da próxima gravação */
      delete s.ocultos;
      if(typeof s.metaMes !== "number" || !(s.metaMes > 0)) s.metaMes = META_MES_PADRAO;
      /* custo nulo = vale o da configuração. O padrão não é gravado no estado,
         de propósito: se fosse, o 0 de hoje ficaria no localStorage da TV e
         ganharia do custo que alguém puser na configuração depois */
      if(typeof s.custoMes !== "number" || !(s.custoMes >= 0)) s.custoMes = null;
      /* formato antigo: meta diária fixa e metas por dia. A meta do dia agora
         sai da meta do mês, então esses campos deixam de ser lidos e gravados. */
      delete s.meta; delete s.metas;
      return s;
    } catch(e){ return { metaMes: META_MES_PADRAO, custoMes: null, lancamentos: [] }; }
  }
  /* ====== tempo (America/Sao_Paulo) ====== */
  var FMT = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  function partesSP(d){
    var p = {}, ps = FMT.formatToParts(d || new Date());
    for(var i=0;i<ps.length;i++) p[ps[i].type] = ps[i].value;
    return { dia:p.year+"-"+p.month+"-"+p.day, h:(+p.hour)%24, m:+p.minute, s:+p.second };
  }
  function hojeSP(){ return partesSP().dia; }
  function dataExtenso(){
    return new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",weekday:"short",day:"2-digit",month:"short"}).format(new Date()).replace(/\./g,"");
  }
  function nomeDia(dia){
    var p = String(dia).split("-");
    if(p.length !== 3) return dia;
    var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12));
    return new Intl.DateTimeFormat("pt-BR",{timeZone:"UTC",weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(d).replace(/-feira/,"");
  }

  /* ====== formatos ====== */
  function brl(v){ return "R$ " + Math.round(v).toLocaleString("pt-BR"); }
  function brlc(v){ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
  /* número puro para dentro de campo editável: 40.000 / 1.870,79 */
  function numeroBR(v){ return v.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function hhmm(min){
    var m = Math.max(0, Math.round(min));
    return Math.floor(m/60) + "h" + (m%60 < 10 ? "0" : "") + (m%60) + "min";
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function paraNumero(txt){
    var t = String(txt).replace(/[^0-9.,]/g,"");
    if(!t) return NaN;
    if(t.indexOf(",") > -1) t = t.replace(/\./g,"").replace(",",".");
    else if(/\.\d{3}(\.|$)/.test(t)) t = t.replace(/\./g,"");
    var n = parseFloat(t);
    return isFinite(n) ? n : NaN;
  }

  /* ====== cálculo ======
     Tudo gira em torno da meta do mês. A meta do dia deixou de ser um número
     fixo: é o que falta dividido pelos dias úteis que ainda restam, então ela
     se reajusta sozinha a cada venda lançada e a cada dia que passa.
     Dia útil = segunda a sexta, tirando os feriados. */
  function mesDe(dia){ return String(dia).slice(0,7); }
  function nomeMes(mes){
    var p = String(mes).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1]-1, 1, 12));
    return new Intl.DateTimeFormat("pt-BR",{timeZone:"UTC",month:"long",year:"numeric"}).format(d);
  }
  function diasNoMes(mes){
    var p = String(mes).split("-");
    return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate();
  }
  /* Feriados que o painel desconta. A lista não foi chutada: na conciliação de
     2026, carnaval (segunda e terça), Tiradentes, 1º de maio, Corpus Christi e
     7 de setembro não tiveram nenhuma receita, e a Sexta-feira Santa teve uma
     só. A quarta de cinzas teve dia normal e continua útil. Contado como útil,
     um feriado entra no divisor sem venda nenhuma e puxa o ritmo para baixo —
     o 7 de setembro tirava R$ 11,8 mil da projeção do mês.
     Os móveis saem da Páscoa, então o calendário vale para qualquer ano. */
  var feriadosCache = {};
  function pascoa(ano){  /* algoritmo de Meeus/Jones/Butcher, calendário gregoriano */
    var a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4;
    var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19*a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l) / 451);
    var n = h + l - 7*m + 114;
    return Date.UTC(ano, Math.floor(n / 31) - 1, (n % 31) + 1, 12);
  }
  function feriadosDo(ano){
    if(feriadosCache[ano]) return feriadosCache[ano];
    var f = {}, p = pascoa(ano), DIA = 864e5;
    function marca(ms){ f[new Date(ms).toISOString().slice(0,10)] = true; }
    ["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"]
      .forEach(function(md){ f[ano + "-" + md] = true; });
    marca(p - 48*DIA); marca(p - 47*DIA);   /* carnaval, segunda e terça */
    marca(p - 2*DIA);                        /* sexta-feira santa */
    marca(p + 60*DIA);                       /* corpus christi */
    (CONFIG.FERIADOS_EXTRAS || []).forEach(function(k){ if(String(k).slice(0,4) === String(ano)) f[k] = true; });
    return (feriadosCache[ano] = f);
  }
  function ehFeriado(dia){ return !!feriadosDo(+String(dia).slice(0,4))[dia]; }
  function ehUtil(mes, dia){
    var p = String(mes).split("-");
    var s = new Date(Date.UTC(+p[0], +p[1]-1, dia, 12)).getUTCDay();
    return s >= 1 && s <= 5 && !ehFeriado(mes + "-" + pad(dia));
  }
  function contaUteis(mes, de, ate){
    var n = 0;
    for(var i = de; i <= ate; i++) if(ehUtil(mes, i)) n++;
    return n;
  }
  function plural(n, um, muitos){ return n + " " + (n === 1 ? um : muitos); }

  function calcular(){
    var ag = partesSP(), hoje = ag.dia, mes = mesDe(hoje);
    var diaNum = +hoje.slice(8,10), ultimo = diasNoMes(mes);

    var doMes = estado.lancamentos.filter(function(l){ return mesDe(l.dia) === mes; });
    var doDia = doMes.filter(function(l){ return l.dia === hoje; });
    var acumulado = doMes.reduce(function(a,l){ return a + l.valor; }, 0);
    var hojeTotal = doDia.reduce(function(a,l){ return a + l.valor; }, 0);

    var metaMes = estado.metaMes;
    var falta = Math.max(metaMes - acumulado, 0);
    var batida = acumulado >= metaMes;

    var uteisTotal = contaUteis(mes, 1, ultimo);
    var uteisDecorridos = contaUteis(mes, 1, diaNum);      /* inclui hoje */
    var uteisRestantes = contaUteis(mes, diaNum, ultimo);  /* inclui hoje */
    var hojeUtil = ehUtil(mes, diaNum);

    var ritmoAtual = uteisDecorridos > 0 ? acumulado / uteisDecorridos : 0;
    var ritmoNec = uteisRestantes > 0 ? falta / uteisRestantes : 0;
    var esperado = uteisTotal > 0 ? metaMes * (uteisDecorridos / uteisTotal) : 0;

    /* A meta do dia é o ritmo necessário congelado no realizado de ONTEM. O
       ritmo necessário se recalcula a cada venda e por isso encolhe durante o
       expediente — bom como bússola do mês, péssimo como alvo do dia, porque o
       alvo fugiria junto com o dinheiro que entra. Congelada, a barra do dia
       enche de verdade e o número não muda debaixo de quem está olhando. */
    var ateOntem = acumulado - hojeTotal;
    var metaHoje = uteisRestantes > 0 ? Math.max(metaMes - ateOntem, 0) / uteisRestantes : 0;
    var pctHoje = metaHoje > 0 ? hojeTotal / metaHoje : (hojeTotal > 0 ? 1 : 0);

    /* Projeção: o realizado mais o ritmo atual vezes os dias úteis que ainda
       vêm DEPOIS de hoje. Hoje não entra de novo — o que entrou hoje já está
       no realizado, e hoje já está no divisor do ritmo atual. Contado duas
       vezes, o dia de hoje inflaria a projeção em um ritmo inteiro. A conta
       fecha igual a ritmo atual × dias úteis do mês. */
    var uteisAposHoje = Math.max(uteisRestantes - (hojeUtil ? 1 : 0), 0);
    var projecao = acumulado + ritmoAtual * uteisAposHoje;

    /* Resultado (lucro) projetado: o faturamento projetado menos o custo do
       mês. O custo não tem ritmo — é o valor do mês inteiro, de uma vez. Sem
       custo informado não há lucro a mostrar, e o painel diz isso em vez de
       exibir o faturamento inteiro como se fosse lucro. */
    var custoMes = custoDoMes();
    var lucro = custoMes > 0 ? projecao - custoMes : null;

    var situacao;
    if(batida) situacao = { txt:"META BATIDA", cls:"ok" };
    else if(uteisRestantes <= 0) situacao = { txt:"MÊS ENCERRADO", cls:"ruim" };
    else {
      var r = esperado > 0 ? acumulado / esperado : 1;
      situacao = r >= 1.02 ? { txt:"ADIANTADO", cls:"ok" } : (r >= 0.9 ? { txt:"NO RITMO", cls:"at" } : { txt:"ATRASADO", cls:"ruim" });
    }
    return {
      hoje:hoje, ag:ag, mes:mes, doMes:doMes, doDia:doDia,
      acumulado:acumulado, hojeTotal:hojeTotal, metaMes:metaMes, falta:falta, batida:batida,
      uteisTotal:uteisTotal, uteisDecorridos:uteisDecorridos, uteisRestantes:uteisRestantes, hojeUtil:hojeUtil,
      ritmoAtual:ritmoAtual, ritmoNec:ritmoNec, esperado:esperado,
      metaHoje:metaHoje, pctHoje:pctHoje,
      projecao:projecao, contraMeta:projecao - metaMes, uteisAposHoje:uteisAposHoje,
      custoMes:custoMes, lucro:lucro,
      pct: metaMes > 0 ? acumulado/metaMes : 0,
      situacao:situacao
    };
  }

  /* ====== render ====== */
  function render(){
    /* preserva o que a pessoa está digitando entre renders (o painel se redesenha sozinho) */
    var foco = document.activeElement && document.activeElement.id, sel = null, vals = {};
    try { if(foco) sel = document.activeElement.selectionStart; } catch(e){}
    ["filtro","meta-mes","custo-mes"]
      .forEach(function(id){ var e = document.getElementById(id); if(e) vals[id] = e.value; });
    /* depois de salvar, os campos voltam a nascer do estado, já formatados */
    if(recarregarMetas){ delete vals["meta-mes"]; delete vals["custo-mes"]; recarregarMetas = false; }

    var d = calcular();
    /* a aba da TV atravessa a virada do mês sem nunca recarregar: sem isto, a
       festa do mês novo ficaria marcada como já vista desde o mês passado */
    if(festaVista && festaMes !== d.mes) festaVista = false;
    var comFesta = (tela === "painel" || modoTV) && d.batida && !festaVista;
    document.body.classList.toggle("festa", comFesta);
    var app = document.getElementById("app");
    app.innerHTML = modoTV
      ? ((comFesta ? festaHTML(d) : "") + tvHTML(d))
      : (tela === "historico" ? historicoHTML(d) : ((comFesta ? festaHTML(d) : "") + painelHTML(d)));
    ligarEventos(d);
    /* duas passadas: a primeira mede antes da fonte assentar e erra por uma
       linha na primeira abertura da tela */
    if(modoTV){ ajustarLista(); requestAnimationFrame(ajustarLista); }
    /* na TV ninguém clica em "ver o painel", e os fogos rodariam a 60fps até
       o fim do mês: a festa toca por um minuto e meio e sai de cena sozinha */
    if(comFesta && modoTV) agendarFimDaFesta();

    Object.keys(vals).forEach(function(id){ var e = document.getElementById(id); if(e && e.value !== vals[id]) e.value = vals[id]; });
    if(foco){ var f = document.getElementById(foco); if(f && f.focus){ f.focus(); try { if(sel != null && f.setSelectionRange) f.setSelectionRange(sel, sel); } catch(e){} } }

    if(comFesta) iniciarFogos(); else pararFogos();
  }
  var fimFesta = 0;
  function agendarFimDaFesta(){
    if(fimFesta) return;
    fimFesta = setTimeout(function(){
      fimFesta = 0; festaVista = true;
      festaMes = mesDe(hojeSP()); try { localStorage.setItem("festa-vista", mesDe(hojeSP())); } catch(e){}
      render();
    }, 90000);
  }
  function irPara(t){
    tela = t; filtro = t === "historico" ? filtro : "";
    try { sessionStorage.setItem("tela", t); } catch(e){}
    render();
    if(t === "historico") window.scrollTo(0,0);
  }

  function painelHTML(d){
    var h = [];
    h.push('<div class="wrap">');
    h.push('<header class="topo">' + logoHTML()
      + '<div class="acoes-topo">'
      + (CONFIG.CSV_RECEITAS || CONFIG.API_URL
          ? '<button class="link" id="atualizar"' + (atualizando ? ' disabled' : '') + '>'
            + (atualizando ? "Buscando…" : "Atualizar") + '</button>' : '')
      + '<button class="link" id="ir-historico">Histórico</button>'
      + '<div class="relogio"><span class="dia">' + esc(dataExtenso()) + '</span>'
      + '<span class="hora tab">' + pad(d.ag.h) + ':' + pad(d.ag.m) + '<span style="font-size:.55em;color:var(--ink-3)">:' + pad(d.ag.s) + '</span></span></div></div></header>');

    if(d.batida && festaVista){
      h.push('<button class="banner" id="revive" style="margin-top:16px">🎉 Meta do mês batida — PIX maluco pra todo mundo · clique pra comemorar de novo</button>');
    }

    h.push('<section class="hero"><div><p class="rot">Realizado em ' + esc(nomeMes(d.mes)) + '</p>'
      + '<p class="big' + (d.acumulado ? "" : " zerado") + ' tab">' + brl(d.acumulado) + '</p>'
      + '<p class="sub">de <span class="metaval tab">' + brl(d.metaMes) + '</span> &middot; <b>' + (d.pct*100).toFixed(1).replace(".",",") + '%</b> da meta do mês</p></div>'
      + '<div class="hero-dir"><span class="pill ' + d.situacao.cls + '">' + d.situacao.txt + '</span>'
      + '<p class="nota">' + notaSituacao(d) + '</p></div></section>');

    var pctBarra = Math.min(d.pct,1)*100;
    var pctMarca = d.uteisTotal > 0 ? Math.min(d.uteisDecorridos/d.uteisTotal,1)*100 : 0;
    h.push('<div class="barra"><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + d.metaMes + '" aria-valuenow="' + Math.round(d.acumulado) + '" aria-label="Progresso da meta do mês">'
      + '<div class="fill" style="width:calc(' + pctBarra.toFixed(2) + '% - 2px)"></div>'
      + (d.uteisRestantes > 0 && d.uteisDecorridos > 0 ? '<div class="marca" style="left:' + pctMarca.toFixed(2) + '%"><span>hoje</span></div>' : '')
      + '</div><div class="ticks"><span>0</span><span>' + brl(d.metaMes/2) + '</span><span>' + brl(d.metaMes) + '</span></div></div>');

    h.push('<section class="kpis">'
      + kpi("Falta para bater", brl(d.falta),
            d.batida ? "meta do mês batida" : plural(d.uteisRestantes, "dia útil", "dias úteis") + " até o fim do mês",
            d.batida ? "acc" : "")
      + kpi("Ritmo atual", brl(d.ritmoAtual) + porDia(),
            "média em " + plural(d.uteisDecorridos, "dia útil", "dias úteis"))
      + kpi("Ritmo necessário", d.uteisRestantes > 0 && !d.batida ? brl(d.ritmoNec) + porDia() : "—",
            d.batida ? "não falta mais nada" : (d.uteisRestantes > 0 ? "por dia útil, até fechar o mês" : "não há mais dia útil"),
            "acc", d.uteisRestantes > 0 && !d.batida ? "destaque" : "")
      + kpi("Hoje", brl(d.hojeTotal),
            !d.hojeUtil ? "hoje não é dia útil"
              : (d.batida || d.uteisRestantes <= 0 ? plural(d.doDia.length, "venda lançada", "vendas lançadas")
                 : "de " + brl(d.metaHoje) + " que hoje precisa trazer"))
      + '</section>');

    h.push(projecaoHTML(d));

    h.push('<div class="colunas">' + lancamentosHTML(d)
      + '<div style="display:flex;flex-direction:column;gap:12px">' + metasHTML(d) + graficoMesHTML(d) + '</div></div>');

    h.push('<footer class="rodape"><span>Meta de ' + brl(d.metaMes) + ' em ' + esc(nomeMes(d.mes))
      + ' &middot; ' + plural(d.uteisTotal, "dia útil", "dias úteis") + ' (seg–sex, sem feriados)</span>'
      + '<span>' + [statusArmazenamento(), statusPlanilha().replace(/^ &middot; /, ""),
                    statusCarteira().replace(/^ &middot; /, "")].filter(Boolean).join(" &middot; ") + '</span></footer>');
    h.push('</div>');
    return h.join("");
  }

  /* ====== tela da TV ======
     Display puro: sem formulário, sem editar, sem apagar, sem histórico. O
     número grande é a meta do dia, que é o que a equipe consegue mudar hoje. */

  /* Às 8h ninguém está atrasado por ter R$ 0 na conta. O esperado sobe junto
     com o relógio ao longo do expediente, e a pill compara contra ele. */
  function fracaoExpediente(h, m){
    var t = h*60 + m, ini = 8*60, fim = 18*60;
    return t <= ini ? 0 : (t >= fim ? 1 : (t - ini) / (fim - ini));
  }
  function situacaoHoje(d){
    if(!d.hojeUtil) return { txt:"SEM META HOJE", cls:"neutro" };
    if(d.batida) return { txt:"MÊS BATIDO", cls:"ok" };
    if(d.pctHoje >= 1) return { txt:"DIA BATIDO", cls:"ok" };
    /* zero hoje pode ser dia fraco ou conciliação que ainda não chegou. O
       painel não sabe a diferença, então não acusa a equipe de atraso por uma
       planilha que ninguém atualizou ainda. */
    if(d.hojeTotal <= 0 && CONFIG.CSV_RECEITAS) return { txt:"AGUARDANDO PLANILHA", cls:"neutro" };
    var f = fracaoExpediente(d.ag.h, d.ag.m);
    if(f <= 0) return { txt:"COMEÇANDO", cls:"neutro" };
    var r = d.pctHoje / f;
    if(r >= 1) return { txt:"ADIANTADO", cls:"ok" };
    return r >= 0.7 ? { txt:"NO RITMO", cls:"at" } : { txt:"ATRASADO", cls:"ruim" };
  }
  /* a nota ao lado da pill fala do DIA — notaSituacao() fala do mês, e os dois
     juntos no mesmo canto faziam a tela dizer duas coisas diferentes */
  function notaHoje(d){
    if(!d.hojeUtil || d.batida) return notaSituacao(d);
    if(d.pctHoje >= 1) return "<b>" + brl(d.hojeTotal - d.metaHoje) + "</b> acima da meta de hoje";
    return "faltam <b>" + brl(d.metaHoje - d.hojeTotal) + "</b> para a meta de hoje";
  }
  /* A conciliação chega em lote — às vezes só no fim do dia. Quando ainda não
     entrou nada hoje, mostrar um "R$ 0" gigante faz o painel parecer quebrado,
     então o número grande vira a meta e a última entrada real vira a legenda. */
  function ultimaEntrada(){
    var maior = "", total = 0;
    estado.lancamentos.forEach(function(l){
      if(l.dia > maior){ maior = l.dia; total = l.valor; }
      else if(l.dia === maior) total += l.valor;
    });
    return maior ? { dia: maior, total: total } : null;
  }
  function diaCurto(dia){
    var p = String(dia).split("-");
    var s = new Intl.DateTimeFormat("pt-BR",{timeZone:"UTC",weekday:"short"})
      .format(new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12))).replace(/\.?$/,"");
    return s + " " + p[2] + "/" + p[1];
  }
  function tvHeroHTML(d){
    var sit = situacaoHoje(d), h = [];
    /* fim de semana não tem meta: o mês assume o número grande */
    if(!d.hojeUtil){
      h.push('<div><p class="rot">Realizado em ' + esc(nomeMes(d.mes)) + '</p>'
        + '<p class="tv-big tab">' + brl(d.acumulado) + '</p>'
        + '<p class="tv-sub">de <b>' + brl(d.metaMes) + '</b> &middot; hoje não é dia útil</p></div>');
    } else if(d.hojeTotal > 0){
      h.push('<div><p class="rot">Entrou hoje</p>'
        + '<p class="tv-big tab">' + brl(d.hojeTotal) + '</p>'
        + '<p class="tv-sub">de <b>' + brl(d.metaHoje) + '</b> que hoje precisa trazer &middot; <b>'
        + (d.pctHoje*100).toFixed(0) + '%</b></p></div>');
    } else {
      var u = ultimaEntrada();
      h.push('<div><p class="rot">Hoje precisa trazer</p>'
        + '<p class="tv-big tab">' + brl(d.metaHoje) + '</p>'
        + '<p class="tv-sub">ainda não entrou nada hoje'
        + (u && u.dia !== d.hoje ? ' &middot; última entrada <b>' + esc(diaCurto(u.dia)) + '</b>, ' + brl(u.total) : '')
        + '</p></div>');
    }
    h.push('<div class="tv-dir"><span class="pill ' + sit.cls + '">' + sit.txt + '</span>'
      + '<p class="nota">' + notaHoje(d) + '</p></div>');
    return '<section class="tv-hero">' + h.join("") + '</section>';
  }
  /* Quantas entradas cabem depende da TV e do que está acima delas — a tarja de
     alerta some e aparece, e o cartão muda de altura junto. Meia linha cortada
     no rodapé faz a tela parecer que travou no meio do carregamento, então a
     conta é feita depois de desenhar, não chutada no CSS. */
  function ajustarLista(){
    var caixa = document.querySelector(".tv-linhas");
    if(!caixa) return;
    var linhas = caixa.querySelectorAll(".tv-linha"), i, j;
    if(!linhas.length) return;
    /* Mede cada linha em vez de dividir a altura por uma média: dividir errava
       por um pixel e deixava a última linha cortada ao meio, que é justamente
       o que faz a tela parecer travada no meio do carregamento. */
    for(i = 0; i < linhas.length; i++) linhas[i].hidden = false;
    for(i = 1; i < linhas.length; i++){
      if(linhas[i].offsetTop + linhas[i].offsetHeight > caixa.clientHeight + 1){
        for(j = i; j < linhas.length; j++) linhas[j].hidden = true;
        break;
      }
    }
  }

  /* Centavos rebaixados: o olho compara reais, o centavo é detalhe. É o gesto
     que mais aproxima a lista de uma tela financeira e menos de um cardápio. */
  function valorTV(v){
    var p = brlc(v).split(",");
    return esc(p[0]) + (p[1] ? '<span class="cent">,' + esc(p[1]) + '</span>' : "");
  }

  function tvHTML(d){
    var h = [];
    h.push('<div class="wrap">');
    h.push('<header class="topo">' + logoHTML()
      + '<div class="relogio"><span class="dia">' + esc(dataExtenso()) + '</span>'
      + '<span class="hora tab">' + pad(d.ag.h) + ':' + pad(d.ag.m) + '</span></div></header>');

    /* leitura da planilha falhando é a única coisa que interrompe a tela: o
       número fica velho e ninguém tem como desconfiar olhando de longe */
    var alerta = CONFIG.CSV_RECEITAS && !csvOk ? "Planilha não lida" + (csvStatus ? " · " + csvStatus : "")
      : (planilhaVelha() ? "Planilha sem resposta há mais de 20 minutos" : "");
    if(alerta) h.push('<div class="tv-alerta">' + esc(alerta) + ' — os números podem estar velhos</div>');

    h.push(tvHeroHTML(d));

    var pctDia = Math.min(Math.max(d.pctHoje, 0), 1) * 100;
    /* onde a barra deveria estar a esta hora do expediente: sem essa marca, 33%
       às 10h e 33% às 17h são o mesmo desenho e contam histórias opostas */
    var agora = d.hojeUtil && !d.batida ? fracaoExpediente(d.ag.h, d.ag.m) * 100 : 0;
    h.push('<div class="barra"><div class="track" role="progressbar" aria-label="Progresso da meta de hoje">'
      + '<div class="fill" style="width:calc(' + pctDia.toFixed(2) + '% - 2px)"></div>'
      + (agora > 0.5 && agora < 96 ? '<div class="marca" style="left:' + agora.toFixed(2) + '%"><span>agora</span></div>' : '')
      + '</div><div class="ticks"><span>0</span><span>' + brl(d.metaHoje/2) + '</span><span>' + brl(d.metaHoje) + '</span></div></div>');

    /* Mesma divisão do painel de computador: a lista manda, o mês acompanha na
       coluna estreita. Empilhado, o herói comia a tela e sobravam duas linhas
       de entrada — justamente a parte viva do painel. */
    h.push('<div class="tv-corpo">');

    /* desenha com folga: ajustarLista() apaga depois as que não couberam */
    var ult = d.doMes.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0,14);
    /* "hoje" repetido em toda linha é ruído: a data só aparece quando muda */
    var soDeHoje = ult.every(function(l){ return l.dia === d.hoje; });
    h.push('<section class="tv-lista"><h3><span>' + (soDeHoje ? "Entrou hoje" : "Últimas entradas") + '</span>'
      + '<span class="conta">' + (d.doDia.length ? plural(d.doDia.length, "recebimento", "recebimentos") + " hoje" : "") + '</span></h3>'
      + (ult.length ? '<div class="tv-linhas">' + ult.map(function(l){
          return '<div class="tv-linha">'
            + (soDeHoje ? "" : '<span class="quando tab">'
                + (l.dia === d.hoje ? "hoje" : l.dia.slice(8,10) + "/" + l.dia.slice(5,7)) + '</span>')
            + '<span class="quem">' + esc(nomeCurto(l.cliente) || "sem identificação") + '</span>'
            + '<span class="val tab">' + valorTV(l.valor) + '</span></div>';
        }).join("") + '</div>' : '<p class="vazio">Nenhuma entrada em ' + esc(nomeMes(d.mes)) + ' ainda.</p>')
      + '</section>');

    h.push('<aside class="tv-lado">'
      + '<div class="bloco"><p class="rot">' + esc(nomeMes(d.mes)) + '</p>'
      + '<p class="val acc tab">' + brl(d.acumulado) + '</p>'
      /* a projeção e o lucro entram na nota do mês e não em blocos próprios: a
         grade de três foi medida para caber sem rolagem, e um quarto bloco
         cortaria as notas */
      + '<p class="nota">' + notaMesTV(d) + '</p></div>'
      /* um só bloco em destaque, como o painel de computador faz */
      + '<div class="bloco destaque"><p class="rot">Falta para bater</p>'
      + '<p class="val acc tab">' + brl(d.falta) + '</p>'
      + '<p class="nota">' + (d.batida ? "meta do mês batida" : "em " + plural(d.uteisRestantes, "dia útil", "dias úteis")) + '</p></div>'
      + '<div class="bloco"><p class="rot">Ritmo necessário</p>'
      + '<p class="val tab">' + (d.uteisRestantes > 0 && !d.batida ? brl(d.ritmoNec) : "—") + '</p>'
      + '<p class="nota">' + (d.doDia.length ? "ticket médio hoje de " + brl(d.hojeTotal/d.doDia.length) : "por dia útil até fechar") + '</p></div>'
      + '</aside>');

    h.push('</div>');

    h.push('<footer class="rodape"><span>Meta de ' + brl(d.metaMes) + ' em ' + esc(nomeMes(d.mes))
      + ' &middot; ' + plural(d.uteisTotal, "dia útil", "dias úteis") + '</span>'
      + '<span>' + statusPlanilha().replace(/^ &middot; /, "") + '</span></footer>');
    h.push('</div>');
    return h.join("");
  }

  /* A marca é a mesma nas três telas. O PNG vem com margem morta em volta — a
     marca ocupa 1649x504 dentro de 2546x1215 — então o recorte é feito por CSS
     e o arquivo original fica intacto. */
  function logoHTML(){
    return '<div class="logo"><span class="marca-vetor">'
      + '<img src="logo-escuro.png" alt="Vetor Saúde e Segurança do Trabalho"></span>'
      + '<span class="kicker">Painel<br>comercial</span></div>';
  }

  /* O nome vem cru do extrato: às vezes com CNPJ na frente, quase sempre com o
     tipo societário no fim e gritado em caixa alta. Na TV isso é ruído — o olho
     precisa achar o cliente, não a razão social inteira. */
  var MINUSCULAS = ["de","da","do","das","dos","e","em","na","no","para","com"];
  function nomeCurto(s){
    var t = String(s || "").trim();
    if(!t) return "";
    /* documento na frente do nome só sai quando é documento mesmo, senão
       "336 Hamburgueria" perderia o próprio nome */
    t = t.replace(/^((?:\d[\d.\/-]*\s+)+)/, function(m){
      return m.replace(/\D/g,"").length >= 8 ? "" : m;
    });
    /* LTDA, EIRELI e EPP são inequívocos e saem de qualquer posição — em
       "Gliko Cantina Escolar LTDA - Matriz" o tipo societário está no meio.
       ME e CIA podem fazer parte do nome, então só saem no fim. */
    t = t.replace(/\s*\b(?:ltda|eireli|epp)\b\.?/gi, " ");
    for(var i = 0; i < 3; i++){
      var n = t.replace(/[\s,.-]*\b(?:mei|me|cia|s\/a|s\.?\s?a)\b\.?\s*$/i, "");
      if(n === t) break;
      t = n;
    }
    t = t.replace(/\s{2,}/g," ").replace(/\s+-\s*$/,"").replace(/[\s.,;&-]+$/,"").trim();
    return t.split(" ").map(function(p, i){
      var baixo = p.toLowerCase();
      if(i > 0 && MINUSCULAS.indexOf(baixo) > -1) return baixo;
      /* sigla curta continua sigla: STK e AG não viram Stk e Ag */
      if(!/[a-zà-ÿ]/.test(p) && p.replace(/[^A-ZÀ-Ý]/g,"").length >= 4){
        return baixo.charAt(0).toUpperCase() + baixo.slice(1);
      }
      return p;
    }).join(" ");
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  /* a conciliação guarda o dia, não a hora — então a linha que veio dela mostra
     um traço no lugar do relógio, em vez de fingir uma hora que ninguém marcou */
  function horaDe(l){ return l.origem === "csv" ? "—" : pad(l.hora) + ":" + pad(l.min); }
  function porDia(){ return '<span style="font-size:.5em;font-weight:600;color:var(--ink-3)">/dia</span>'; }
  function notaSituacao(d){
    if(d.batida) return "<b>" + brl(d.acumulado - d.metaMes) + "</b> acima da meta do mês";
    if(d.uteisRestantes <= 0) return "o mês fechou <b>" + brl(d.metaMes - d.acumulado) + "</b> abaixo";
    var dif = d.acumulado - d.esperado;
    return (dif >= 0 ? "<b>" + brl(dif) + "</b> à frente" : "<b>" + brl(-dif) + "</b> atrás")
      + " do esperado para o " + d.uteisDecorridos + "º dia útil";
  }
  function kpi(rot, val, nota, cls, extra){
    return '<div class="kpi ' + (extra||"") + '"><p class="rot">' + rot + '</p><p class="val ' + (cls||"") + ' tab">' + val + '</p><p class="nota">' + nota + '</p></div>';
  }

  /* ---- projeção do mês ----
     Mantido o ritmo atual até o último dia útil, quanto o mês fatura e quanto
     sobra ou falta contra a meta. A conta vai aberta embaixo: uma projeção que
     ninguém consegue refazer de cabeça não convence ninguém. */
  function temProjecao(d){ return d.uteisDecorridos > 0 && d.acumulado > 0; }
  function projecaoHTML(d){
    if(!temProjecao(d)){
      return '<section class="projecao"><div class="proj-cab"><h3>Projeção do mês</h3>'
        + '<p class="legenda">aparece depois do primeiro dia útil com venda</p></div></section>';
    }
    var acima = d.contraMeta >= 0;
    var conta = d.uteisAposHoje > 0
      ? brl(d.acumulado) + ' realizado + ' + brl(d.ritmoAtual) + '/dia × '
        + plural(d.uteisAposHoje, "dia útil", "dias úteis") + (d.hojeUtil ? ' depois de hoje' : ' que faltam')
        + ' = ' + brl(d.projecao) + ' de faturamento'
      : 'não há dia útil depois de hoje: o faturamento projetado é o próprio realizado';
    if(d.lucro !== null){
      conta += ' &middot; ' + brl(d.projecao) + ' − ' + brl(d.custoMes) + ' de custo = '
        + (d.lucro < 0 ? '− ' : '') + brl(Math.abs(d.lucro)) + ' de resultado';
    }
    /* a carteira é a outra resposta para "onde o mês termina": a primeira é
       estimativa pelo ritmo, esta é o que já está emitido. As duas ficam lado
       a lado de propósito — quando se afastam muito, é sinal de alguma coisa. */
    var car = carteiraDoMes(d);
    if(car && car.total > 0){
      conta += ' &middot; com o que já está emitido, ' + brl(d.acumulado) + ' + ' + brl(car.total)
        + ' = ' + brl(d.acumulado + car.total) + ' no mês';
    }
    return '<section class="projecao' + (car ? ' com-carteira' : '') + '">'
      + '<div class="proj-cab"><h3>Projeção do mês</h3><p class="legenda">mantido o ritmo atual até o último dia útil</p></div>'
      + '<div class="proj-num"><p class="rot">Faturamento projetado</p>'
      + '<p class="val tab">' + brl(d.projecao) + '</p>'
      + '<p class="nota">' + (d.projecao / d.metaMes * 100).toFixed(0) + '% da meta &middot; '
      + (acima ? brl(d.contraMeta) + ' acima' : 'faltam ' + brl(-d.contraMeta)) + '</p></div>'
      + (car ? '<div class="proj-num"><p class="rot">A entrar até ' + car.ate + '</p>'
          + '<p class="val tab acc">' + brl(car.total) + '</p>'
          + '<p class="nota">' + (car.qtd
              ? plural(car.qtd, "título em aberto", "títulos em aberto")
                + (car.vencido > 0 ? ' &middot; ' + brl(car.vencido) + ' já vencidos' : '')
              : 'nada em aberto vencendo neste mês') + '</p></div>' : '')
      + '<div class="proj-num"><p class="rot">Custo do mês</p>'
      + '<p class="val tab">' + (d.custoMes > 0 ? brl(d.custoMes) : '—') + '</p>'
      + '<p class="nota">' + (d.custoMes > 0 ? 'o mês inteiro, de uma vez' : 'informe no quadro Meta do mês') + '</p></div>'
      + '<div class="proj-num"><p class="rot">Resultado projetado</p>'
      + (d.lucro === null
          ? '<p class="val tab">—</p><p class="nota">precisa do custo do mês</p>'
          : '<p class="val tab ' + (d.lucro >= 0 ? "pos" : "neg") + '">' + (d.lucro < 0 ? "− " : "") + brl(Math.abs(d.lucro)) + '</p>'
            + '<p class="nota">' + (d.lucro >= 0
                ? 'lucro &middot; margem de ' + (d.lucro / d.projecao * 100).toFixed(0) + '% sobre o faturamento'
                : 'prejuízo, no ritmo atual') + '</p>')
      + '</div>'
      + '<p class="proj-conta">' + conta + '</p>'
      + '</section>';
  }

  /* custo nulo = vale o da configuração; um número = alguém salvou no painel */
  function custoDoMes(){
    return typeof estado.custoMes === "number" && estado.custoMes >= 0 ? estado.custoMes : (+CONFIG.CUSTO_MES || 0);
  }
  /* nota do bloco do mês na TV, sempre numa linha: com custo, a projeção e o
     lucro; sem custo, o percentual da meta e a projeção */
  function notaMesTV(d){
    var pct = '<b>' + (d.pct*100).toFixed(1).replace(".",",") + '%</b> da meta';
    if(!temProjecao(d)) return pct + ' de ' + brl(d.metaMes);
    if(d.lucro === null) return pct + ' &middot; projeção <b>' + brl(d.projecao) + '</b>';
    return 'projeção <b>' + brl(d.projecao) + '</b> &middot; '
      + (d.lucro >= 0 ? 'lucro <b>' + brl(d.lucro) : 'prejuízo <b>' + brl(-d.lucro)) + '</b>';
  }

  function metasHTML(d){
    if(somenteLeitura) return "";
    var custoProprio = typeof estado.custoMes === "number", custoConfig = +CONFIG.CUSTO_MES || 0;
    return '<div class="painel"><h3>Meta do mês</h3>'
      + '<p class="legenda">Vale para ' + esc(nomeMes(d.mes)) + '. O ritmo necessário sai da meta; o lucro projetado, do custo.</p>'
      + '<form class="lanc metas-form" id="form-metas">'
      + '<div class="campo"><label class="rot" for="meta-mes" style="display:block;margin-bottom:6px">Meta do mês (R$)</label>'
      + '<input id="meta-mes" inputmode="decimal" autocomplete="off" value="' + esc(numeroBR(d.metaMes)) + '" aria-label="Meta do mês em reais"></div>'
      + '<div class="campo"><label class="rot" for="custo-mes" style="display:block;margin-bottom:6px">Custo do mês (R$)</label>'
      + '<input id="custo-mes" inputmode="decimal" autocomplete="off" value="' + (custoProprio ? esc(numeroBR(estado.custoMes)) : '') + '"'
      + ' placeholder="' + (custoConfig > 0 ? 'em branco: ' + esc(numeroBR(custoConfig)) + ', da configuração' : 'não informado') + '" aria-label="Custo do mês em reais"></div>'
      + '<button class="btn" type="submit">Salvar</button>'
      + '<p class="meta-atual">' + plural(d.uteisTotal, "dia útil", "dias úteis") + ' no mês, sem feriados &middot; '
      + brl(d.uteisTotal > 0 ? d.metaMes/d.uteisTotal : 0) + ' por dia se a meta fosse dividida por igual.</p>'
      + '<p class="aviso' + (avisoMetaOk ? " ok" : "") + '" role="status">' + esc(avisoMeta) + '</p></form></div>';
  }

  /* Gráfico do mês: uma coluna por dia útil, o recebimento do dia na altura.
     Série única — nenhuma legenda, o subtítulo diz o que está plotado — e uma
     linha de referência na meta dividida por igual pelos dias úteis. O valor
     aparece escrito só no maior dia: número em cima de toda coluna vira ruído
     e ninguém lê. O resto sai na dica ao passar o mouse, e a mesma informação
     em tabela é a tela de Histórico, então nada fica preso na dica.
     Só no computador: a grade da TV foi medida para caber sem rolagem. */
  function graficoMesHTML(d){
    var ultimo = diasNoMes(d.mes), porDia = {}, dias = [], i;
    d.doMes.forEach(function(l){ porDia[l.dia] = (porDia[l.dia] || 0) + l.valor; });
    for(i = 1; i <= ultimo; i++){
      if(!ehUtil(d.mes, i)) continue;
      var k = d.mes + "-" + pad(i);
      dias.push({ n:i, dia:k, v:porDia[k] || 0, hoje:k === d.hoje, futuro:k > d.hoje });
    }
    if(!dias.length) return "";
    var alvo = d.uteisTotal > 0 ? d.metaMes / d.uteisTotal : 0;
    var maior = dias.reduce(function(a, x){ return x.v > a ? x.v : a; }, 0);
    var escala = Math.max(maior, alvo);
    if(!(escala > 0)) return "";
    var diaMaior = maior > 0 ? dias.filter(function(x){ return x.v === maior; })[0].dia : "";

    return '<div class="painel"><h3>Dia a dia</h3>'
      + '<p class="legenda">Cada coluna é um dia útil de ' + esc(nomeMes(d.mes))
      + '. A linha marca ' + brl(alvo) + ' por dia, que é a meta dividida por igual.</p>'
      + '<div class="g-plot">'
      + dias.map(function(x){
          var pct = Math.max(x.v/escala*100, 0);
          var dica = diaCurto(x.dia) + " · " + (x.v > 0 ? brlc(x.v) : (x.futuro ? "ainda não chegou" : "nada"));
          return '<div class="g-band' + (x.hoje ? " hoje" : "") + '" tabindex="0"'
            + ' data-dica="' + esc(dica) + '" aria-label="' + esc(dica) + '">'
            + (x.dia === diaMaior ? '<span class="g-max" style="bottom:calc(' + pct.toFixed(2) + '% + 5px)">' + brl(x.v) + '</span>' : '')
            + '<i class="g-bar' + (x.v > 0 ? "" : (x.futuro ? " futuro" : " zero")) + '" style="height:' + pct.toFixed(2) + '%"></i>'
            + '</div>';
        }).join("")
      /* por último de propósito: fora do fluxo, não desloca nada, e deixa a
         contagem de :nth-child bater com as colunas */
      + '<div class="g-alvo" style="bottom:' + (alvo/escala*100).toFixed(2) + '%"></div>'
      + '</div><div class="g-eixo">'
      + dias.map(function(x){ return '<span' + (x.hoje ? ' class="hoje"' : '') + '>' + pad(x.n) + '</span>'; }).join("")
      + '</div></div>';
  }

  /* Só leitura: a receita vem da planilha financeira e não se lança, corrige
     nem apaga por aqui. Uma linha errada se conserta na planilha, e na
     próxima leitura o painel acompanha. */
  function lancamentosHTML(d){
    var todos = d.doMes.slice().sort(function(a,b){ return b.ts - a.ts; });
    var itens = todos.slice(0,10);
    return '<div class="painel"><h3>Últimos lançamentos</h3><p class="legenda">'
      + plural(todos.length, "recebimento", "recebimentos") + ' em ' + esc(nomeMes(d.mes))
      + ' &middot; direto da planilha financeira</p>'
      + (itens.length ? '<ul class="lista">' + itens.map(function(l){
          var q = (l.dia === d.hoje ? "" : l.dia.slice(8,10) + "/" + l.dia.slice(5,7) + " ") + horaDe(l);
          var quem = esc([l.vendedor, nomeCurto(l.cliente)].filter(Boolean).join(" · ") || "sem identificação");
          return '<li><span class="quando tab">' + q + '</span><span class="quem">' + quem + '</span>'
            + '<span class="qtd tab">' + brlc(l.valor) + '</span></li>';
        }).join("") + '</ul>' : '<p class="vazio">Nenhum recebimento em ' + esc(nomeMes(d.mes)) + ' ainda.</p>') + '</div>';
  }
  /* ---- histórico completo ---- */
  function agrupaDias(){
    var mapa = {};
    estado.lancamentos.forEach(function(l){
      if(!mapa[l.dia]) mapa[l.dia] = { dia:l.dia, itens:[], total:0 };
      mapa[l.dia].itens.push(l); mapa[l.dia].total += l.valor;
    });
    return Object.keys(mapa).sort().reverse().map(function(k){
      mapa[k].itens.sort(function(a,b){ return (a.hora*60+a.min) - (b.hora*60+b.min); });
      return mapa[k];
    });
  }
  function casa(l, termo){
    if(!termo) return true;
    var t = termo.toLowerCase();
    return (l.vendedor||"").toLowerCase().indexOf(t) > -1
      || (l.cliente||"").toLowerCase().indexOf(t) > -1
      || String(Math.round(l.valor)).indexOf(t.replace(/\D/g,"")) > -1 && /\d/.test(t);
  }
  function historicoHTML(d){
    var dias = agrupaDias();
    var filtrados = dias.map(function(g){
      var itens = g.itens.filter(function(l){ return casa(l, filtro); });
      return { dia:g.dia, itens:itens, total:itens.reduce(function(a,l){ return a + l.valor; },0), totalDia:g.total };
    }).filter(function(g){ return g.itens.length; });

    var totalGeral = filtrados.reduce(function(a,g){ return a + g.total; }, 0);
    var qtd = filtrados.reduce(function(a,g){ return a + g.itens.length; }, 0);
    var melhor = filtrados.slice().sort(function(a,b){ return b.totalDia - a.totalDia; })[0];
    var media = filtrados.length ? totalGeral / filtrados.length : 0;
    var topo = melhor && melhor.totalDia > 0 ? melhor.totalDia : 1;

    var h = ['<div class="wrap">'];
    h.push('<header class="topo">' + logoHTML()
      + '<div class="acoes-topo"><button class="link" id="baixar-csv">Baixar CSV</button>'
      + '<button class="link forte" id="ir-painel">Voltar ao painel</button></div></header>');

    h.push('<div class="hist-topo"><div><h2>Histórico de lançamentos</h2>'
      + '<p>' + (dias.length ? 'Todos os dias registrados neste painel · de ' + nomeDia(dias[dias.length-1].dia) + ' até ' + nomeDia(dias[0].dia) : 'Nenhum lançamento registrado ainda') + '</p></div>'
      + (avisoHist ? '<p class="aviso' + (avisoOk ? " ok" : "") + '" role="status" style="margin:0">' + esc(avisoHist) + '</p>' : '') + '</div>');

    h.push('<section class="resumo">'
      + kpi("Total no período", brl(totalGeral), plural(qtd, "venda", "vendas"), "acc")
      + kpi("Em " + esc(nomeMes(d.mes)), brl(d.acumulado), (d.pct*100).toFixed(0) + "% da meta de " + brl(d.metaMes))
      + kpi("Dias com venda", String(filtrados.length), "de " + plural(d.uteisTotal, "dia útil", "dias úteis") + " no mês")
      + kpi("Melhor dia", melhor ? brl(melhor.totalDia) : "—", melhor ? nomeDia(melhor.dia) : "sem dados")
      + kpi("Média por dia", brl(media), "considerando dias com venda")
      + '</section>');

    h.push('<div class="busca"><input id="filtro" value="' + esc(filtro) + '" placeholder="Filtrar por vendedor, cliente ou valor" aria-label="Filtrar lançamentos">'
      + (filtro ? '<button class="link" id="limpar-filtro">Limpar</button>' : '') + '</div>');

    if(!filtrados.length){
      h.push('<p class="sem-resultado">' + (filtro ? "Nenhum lançamento encontrado para “" + esc(filtro) + "”." : "Assim que a equipe lançar a primeira venda, ela aparece aqui.") + '</p>');
    } else {
      filtrados.forEach(function(g){
        var aberto = diasAbertos[g.dia] !== undefined ? diasAbertos[g.dia] : (g.dia === d.hoje || !!filtro);
        h.push('<div class="dia' + (aberto ? " aberto" : "") + '">'
          + '<button class="dia-cab" data-dia="' + esc(g.dia) + '" aria-expanded="' + aberto + '">'
          + '<span class="data"><span class="seta">▶</span>' + esc(nomeDia(g.dia)) + '</span>'
          + '<span class="tot tab">' + brl(g.totalDia) + '</span>'
          + '<span class="meta-info"><span>' + plural(g.itens.length, "venda", "vendas")
          + (filtro ? ' de ' + brl(g.total) + ' no filtro' : '') + '</span>'
          + '<span class="db"><i style="width:' + Math.min(g.totalDia/topo*100,100).toFixed(1) + '%"></i></span>'
          + '<span class="tab">' + (g.totalDia/topo*100).toFixed(0) + '% do melhor dia</span></span></button>');
        if(aberto){
          h.push('<div class="dia-corpo">' + g.itens.map(function(l){
            var quem = l.cliente ? '<b>' + esc(nomeCurto(l.cliente)) + '</b>' + (l.vendedor ? ' · ' + esc(l.vendedor) : '') : (l.vendedor ? esc(l.vendedor) : '<span style="color:var(--ink-3)">sem identificação</span>');
            return '<div class="hist-linha"><span class="hora tab">' + horaDe(l) + '</span>'
              + '<span class="quem">' + quem + '</span>'
              + '<span class="val tab">' + brlc(l.valor) + '</span></div>';
          }).join("") + '</div>');
        }
        h.push('</div>');
      });
    }
    h.push('<footer class="rodape"><span>' + plural(estado.lancamentos.length, "lançamento guardado", "lançamentos guardados") + ' no painel</span>'
      + '<span>horário de Brasília</span></footer></div>');
    return h.join("");
  }

  function montarCSV(){
    var linhas = [["data","hora","vendedor","cliente","valor"]];
    estado.lancamentos.slice().sort(function(a,b){
      return a.dia === b.dia ? (a.hora*60+a.min) - (b.hora*60+b.min) : (a.dia < b.dia ? -1 : 1);
    }).forEach(function(l){
      linhas.push([l.dia, pad(l.hora)+":"+pad(l.min), l.vendedor||"", l.cliente||"", String(l.valor).replace(".",",")]);
    });
    return "﻿" + linhas.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(";");
    }).join("\r\n");
  }

  function festaHTML(d){
    var ordem = d.doMes.slice().sort(function(a,b){ return a.ts - b.ts; });
    var soma = 0, quando = "";
    for(var i=0;i<ordem.length;i++){
      soma += ordem[i].valor;
      if(soma >= d.metaMes){ quando = ordem[i].dia.slice(8,10) + "/" + ordem[i].dia.slice(5,7); break; }
    }
    return '<div class="party-bg"></div><div class="party"><p class="party-kicker">Meta de ' + brl(d.metaMes) + ' batida' + (quando ? ' em ' + quando : '') + '</p>'
      + '<h1 class="party-title">PIX MALUCO<br>PRA TODO MUNDO</h1>'
      + '<p class="party-sub"><span>' + brl(d.acumulado) + '</span> vendidos em ' + esc(nomeMes(d.mes)) + '</p>'
      + '<button class="btn-ghost" id="ver-painel">ver o painel</button></div>';
  }

  /* ====== eventos ====== */
  function ligarEventos(d){
    /* ---- meta do mês ---- */
    var fm = document.getElementById("form-metas");
    if(fm){
      fm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var m = paraNumero(document.getElementById("meta-mes").value);
        if(!isFinite(m) || m <= 0){
          avisoMeta = "A meta precisa ser maior que zero."; avisoMetaOk = false; render(); return;
        }
        /* custo em branco volta a valer o da configuração */
        var ct = String(document.getElementById("custo-mes").value).trim();
        var c = ct === "" ? null : paraNumero(ct);
        if(c !== null && (!isFinite(c) || c < 0)){
          avisoMeta = "O custo precisa ser um valor em reais, ou ficar em branco."; avisoMetaOk = false; render(); return;
        }
        /* meta nova: a festa pode valer de novo se o mês passar a estar batido */
        festaVista = false;
        festaMes = ""; try { localStorage.removeItem("festa-vista"); } catch(e){}
        salvarMetas(Math.round(m*100)/100, c === null ? null : Math.round(c*100)/100, "Meta e custo salvos.");
      });
    }
    /* relê a planilha sem recarregar a página: o F5 joga fora o estado da tela
       (a meta sendo digitada, o dia expandido no histórico, o filtro) para
       buscar um CSV de poucos kB */
    var at = document.getElementById("atualizar");
    if(at) at.addEventListener("click", function(){
      if(atualizando) return;
      atualizando = true; render();
      var fim = function(){ atualizando = false; render(); };
      buscarCSV()
        .then(function(){ return CONFIG.API_URL ? buscarAPI().catch(function(){}) : null; })
        .then(fim, fim);
    });

    var ih = document.getElementById("ir-historico");
    if(ih) ih.addEventListener("click", function(){ irPara("historico"); });
    var ip = document.getElementById("ir-painel");
    if(ip) ip.addEventListener("click", function(){ avisoHist = ""; irPara("painel"); });

    var fi = document.getElementById("filtro");
    if(fi){
      fi.addEventListener("input", function(){
        filtro = fi.value;
        var pos = fi.selectionStart;
        render();
        var novo = document.getElementById("filtro");
        if(novo){ novo.focus(); try { novo.setSelectionRange(pos, pos); } catch(e){} }
      });
    }
    var lf = document.getElementById("limpar-filtro");
    if(lf) lf.addEventListener("click", function(){ filtro = ""; render(); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-dia]"), function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.dia;
        var atual = b.getAttribute("aria-expanded") === "true";
        diasAbertos[k] = !atual;
        render();
      });
    });

    var bc = document.getElementById("baixar-csv");
    if(bc) bc.addEventListener("click", function(){
      if(!estado.lancamentos.length){ avisoHist = "Não há lançamentos para exportar."; avisoOk = false; render(); return; }
      try {
        var blob = new Blob([montarCSV()], { type:"text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "lancamentos-vetor-" + hojeSP() + ".csv";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
        avisoHist = "CSV gerado."; avisoOk = true; render();
      } catch(e){ avisoHist = "Não deu para gerar o CSV neste navegador."; avisoOk = false; render(); }
    });

    var vp = document.getElementById("ver-painel");
    if(vp) vp.addEventListener("click", function(){
      festaVista = true;
      festaMes = mesDe(hojeSP()); try { localStorage.setItem("festa-vista", mesDe(hojeSP())); } catch(e){}
      render();
    });
    var rv = document.getElementById("revive");
    if(rv) rv.addEventListener("click", function(){
      festaVista = false;
      festaMes = ""; try { localStorage.removeItem("festa-vista"); } catch(e){}
      render();
    });
  }


  /* ====== persistência ======
     Esta é a versão para hospedagem própria: sem API_URL, cada navegador
     guarda o seu no localStorage; com API_URL, o estado inteiro — meta do mês
     e lançamentos — vai e volta do servidor. */
  var ultimaSync = 0, syncOk = true;
  var CHAVE = "ritmo40k";

  function carregarLocal(){
    try {
      var t = localStorage.getItem(CHAVE);
      if(!t) return null;
      var s = JSON.parse(t);
      if(s && Array.isArray(s.lancamentos)) return s;
    } catch(e){}
    return null;
  }
  function gravarLocal(){
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); return true; } catch(e){ return false; }
  }
  function cabecalhos(){
    var h = { "Content-Type": "application/json" };
    if(CONFIG.API_TOKEN) h["Authorization"] = "Bearer " + CONFIG.API_TOKEN;
    return h;
  }
  function normalizar(l){
    if(!l) return null;
    var v = typeof l.valor === "number" ? l.valor : paraNumero(l.valor);
    if(!isFinite(v) || v <= 0) return null;
    var ts = +l.ts || Date.parse(l.ts) || Date.now();
    var p = partesSP(new Date(ts));
    return {
      id: String(l.id || (ts + "-" + Math.random().toString(36).slice(2,7))),
      ts: ts,
      dia: l.dia || p.dia,
      hora: typeof l.hora === "number" ? l.hora : p.h,
      min: typeof l.min === "number" ? l.min : p.m,
      valor: Math.round(v*100)/100,
      vendedor: l.vendedor || "",
      cliente: l.cliente || "",
      /* "csv" = veio da conciliação; vazio = digitado à mão neste painel */
      origem: l.origem === "csv" ? "csv" : ""
    };
  }
  function buscarAPI(){
    return fetch(CONFIG.API_URL, { headers: cabecalhos(), cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){
        /* a API sincroniza só o que ainda é digitado — meta e custo. Receita
           vem da planilha e de mais lugar nenhum, nem de um servidor. */
        var mudou = false;
        if(j && typeof j.metaMes === "number" && j.metaMes > 0 && j.metaMes !== estado.metaMes){ estado.metaMes = j.metaMes; mudou = true; }
        if(j && (typeof j.custoMes === "number" || j.custoMes === null) && j.custoMes !== estado.custoMes){ estado.custoMes = j.custoMes; mudou = true; }
        if(mudou){ gravarLocal(); render(); }
        ultimaSync = Date.now(); syncOk = true;
      })
      .catch(function(e){ syncOk = false; throw e; });
  }
  function enviarAPI(){
    return fetch(CONFIG.API_URL, {
      method: "POST",
      headers: cabecalhos(),
      body: JSON.stringify({ metaMes: estado.metaMes, custoMes: estado.custoMes })
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      ultimaSync = Date.now(); syncOk = true;
    }).catch(function(e){ syncOk = false; throw e; });
  }
  /* a receita não é salva em lugar nenhum pelo painel — ela é lida. O que
     este aviso descreve é só onde ficam meta e custo. */
  function statusArmazenamento(){
    if(!CONFIG.API_URL) return "";
    return syncOk ? "meta e custo sincronizados" : "meta e custo sem conexão com o servidor";
  }

  /* Só a leitura da planilha chega aqui. O número da tela é o da planilha
     mesmo que o navegador recuse guardar a cópia: antes, uma recusa desfazia a
     leitura e deixava a TV mostrando receita velha. Guardar serve só para a
     tela não abrir vazia na próxima vez. */
  function salvar(lancamentos){
    estado.lancamentos = lancamentos;
    gravarLocal();
    render();
  }

  /* a meta muda sem tocar nos lançamentos, então tem o seu próprio caminho de
     gravação — com o mesmo cuidado de desfazer se o navegador recusar salvar */
  var limpezaAviso = 0;
  function agendarLimpeza(){
    clearTimeout(limpezaAviso);
    limpezaAviso = setTimeout(function(){
      if(avisoMeta){ avisoMeta = ""; render(); }
    }, 5000);
  }
  function salvarMetas(metaMes, custoMes, ok){
    var anterior = estado.metaMes, custoAnterior = estado.custoMes;
    estado.metaMes = metaMes; estado.custoMes = custoMes;
    if(!gravarLocal() && !CONFIG.API_URL){
      estado.metaMes = anterior; estado.custoMes = custoAnterior;
      avisoMeta = "Não deu para salvar neste navegador."; avisoMetaOk = false; render();
      return;
    }
    avisoMeta = ok; avisoMetaOk = true; recarregarMetas = true;
    agendarLimpeza();
    render();
    if(!CONFIG.API_URL) return;
    enviarAPI().catch(function(){
      avisoMeta = "Sem conexão com o servidor. A meta ficou salva neste navegador e vai junto na próxima tentativa.";
      avisoMetaOk = false; render();
    });
  }
  function iniciarSync(){
    if(!CONFIG.API_URL) return;
    buscarAPI().catch(function(){ render(); });
    setInterval(function(){ buscarAPI().catch(function(){}); }, Math.max(CONFIG.SYNC_SEGUNDOS || 15, 5) * 1000);
  }

  /* ====== conciliação bancária ======
     A planilha de conciliação vira a fonte das receitas: cada linha com
     Categoria "Receita" entra como um lançamento, com o nome de quem pagou.

     O id de cada lançamento sai do conteúdo da própria linha (dia, banco,
     nome, descrição e valor), então reler a planilha mil vezes não duplica
     nada e não depende da ordem das linhas. Linha que entra na planilha
     aparece; linha que sai some; linha corrigida lá é corrigida aqui. Pelo
     painel não se lança, corrige nem apaga receita. */
  var csvStatus = "", csvOk = false, csvUltima = 0, csvQtd = 0;

  /* parser tolerante: aspas, vírgula ou ponto-e-vírgula, CRLF e quebra dentro
     de aspas (a descrição do Nubank vem com quebra de linha no meio) */
  function csvLinhas(txt){
    var s = String(txt);
    if(s.charCodeAt(0) === 65279) s = s.slice(1);   /* BOM que o Sheets manda */
    var prim = s.split("\n")[0];
    var sep = prim.split(";").length > prim.split(",").length ? ";" : ",";
    var linhas = [], linha = [], campo = "", aspas = false;
    for(var i = 0; i < s.length; i++){
      var c = s.charAt(i);
      if(aspas){
        if(c !== '"') campo += c;
        else if(s.charAt(i+1) === '"'){ campo += '"'; i++; }
        else aspas = false;
      }
      else if(c === '"') aspas = true;
      else if(c === sep){ linha.push(campo); campo = ""; }
      else if(c === "\n"){ linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
      else if(c !== "\r") campo += c;
    }
    if(campo !== "" || linha.length){ linha.push(campo); linhas.push(linha); }
    return linhas.filter(function(r){
      return r.some(function(c){ return String(c).trim() !== ""; });
    });
  }
  /* "DESCRIÇÃO" e "Descricao" são a mesma coluna. O intervalo de acentos é
     montado por código para o arquivo seguir só com ASCII nesta parte. */
  var ACENTOS = new RegExp("[" + String.fromCharCode(768) + "-" + String.fromCharCode(879) + "]", "g");
  function chaveCol(s){
    return String(s).toLowerCase().normalize("NFD").replace(ACENTOS,"").replace(/[^a-z]/g,"");
  }
  /* paraNumero() joga fora o sinal, e aqui o sinal é o que separa receita de
     taxa: o menos pode vir antes do número ou antes do "R$" */
  function valorPlanilha(txt){
    var t = String(txt).trim();
    var i = t.search(/\d/);
    var neg = (i > -1 && t.slice(0,i).indexOf("-") > -1) || (t.charAt(0) === "(" && t.slice(-1) === ")");
    var n = paraNumero(t);
    if(!isFinite(n)) return NaN;
    return neg ? -n : n;
  }
  function diaPlanilha(txt){
    var t = String(txt).trim();
    var m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + pad(+m[2]) + "-" + pad(+m[1]);
    m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[1] + "-" + m[2] + "-" + m[3] : "";
  }
  /* dois hashes de 32 bits concatenados: com um só, 2.500 linhas já dão ~0,08%
     de chance de duas colidirem — e a linha colidida sumiria sem aviso */
  function hashLinha(s){
    var a = 5381, b = 52711;
    for(var i = 0; i < s.length; i++){
      var c = s.charCodeAt(i);
      a = ((a * 33) ^ c) >>> 0;
      b = ((b * 31) + c) >>> 0;
    }
    return a.toString(36) + b.toString(36);
  }
  /* devolve null quando o CSV não tem cara de conciliação — assim uma URL
     errada vira aviso na tela em vez de apagar o mês inteiro */
  function lancamentosDoCSV(txt){
    var linhas = csvLinhas(txt);
    if(linhas.length < 2) return null;
    var col = {};
    linhas[0].forEach(function(nome, i){
      var k = chaveCol(nome);
      if(col[k] === undefined) col[k] = i;
    });
    if(col.data === undefined || col.valor === undefined) return null;
    /* aba já filtrada pode vir sem a coluna Categoria: aí toda entrada positiva
       que sobrou é receita, que é justamente o que a aba se propôs a listar */
    var temCat = col.categoria !== undefined;
    function cel(r, k){ return col[k] === undefined ? "" : String(r[col[k]] || "").trim(); }

    var vistos = {}, ordem = {}, out = [];
    for(var i = 1; i < linhas.length; i++){
      var r = linhas[i];
      if(temCat && chaveCol(cel(r, "categoria")) !== "receita") continue;
      var v = valorPlanilha(cel(r, "valor"));
      if(!isFinite(v) || v <= 0) continue;
      var dia = diaPlanilha(cel(r, "data"));
      if(!dia) continue;
      var base = [dia, cel(r, "banco"), cel(r, "nome"), cel(r, "descricao"), v.toFixed(2)].join("|");
      vistos[base] = (vistos[base] || 0) + 1;
      ordem[dia] = (ordem[dia] || 0) + 1;
      var p = dia.split("-");
      out.push({
        id: "csv" + hashLinha(base + "#" + vistos[base]),
        /* meio-dia de Brasília, com um segundo por linha só para a ordem do
           dia sair igual à da planilha */
        ts: Date.UTC(+p[0], +p[1]-1, +p[2], 15, 0, 0) + ordem[dia] * 1000,
        dia: dia, hora: 12, min: 0,
        valor: Math.round(v*100)/100,
        vendedor: "", cliente: cel(r, "nome").slice(0,60), origem: "csv"
      });
    }
    return out;
  }
  /* A planilha é a única fonte da receita: o painel mostra exatamente o que
     ela diz, sem somar, tirar nem corrigir nada. Antes, uma linha apagada no
     painel ia para uma lista de ocultos e era pulada em toda leitura, e uma
     linha corrigida à mão parava de ser atualizada — as duas coisas moravam
     no navegador e faziam o realizado divergir da planilha em silêncio.
     Quem muda o número é a planilha financeira, e só ela. null = nada mudou. */
  function casarComPlanilha(novos){
    function assinatura(lista){
      return lista.map(function(l){ return l.id + "|" + l.valor + "|" + l.dia + "|" + l.cliente; }).sort().join("\n");
    }
    return assinatura(novos) === assinatura(estado.lancamentos) ? null : novos;
  }
  /* cache: "no-store" só manda no cache do navegador. O Google guarda o CSV
     publicado do lado dele por alguns minutos, e a única forma de tentar furar
     isso é pedir uma URL diferente a cada leitura. Nem sempre funciona — às
     vezes a versão nova demora a aparecer mesmo assim. */
  function urlCSV(){
    var u = CONFIG.CSV_RECEITAS;
    return u + (u.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now();
  }
  function buscarCSV(){
    if(!CONFIG.CSV_RECEITAS) return Promise.resolve();
    return fetch(urlCSV(), { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(t){
        var novos = lancamentosDoCSV(t);
        if(!novos) throw new Error("faltam as colunas DATA e VALOR");
        /* CSV cortado no meio do download, ou a =QUERY virando #REF!, devolve
           um lote válido e curto — e o casamento apagaria o mês inteiro sem
           ninguém perceber, porque na TV não há quem confira. Sumiu muita
           coisa de uma vez: recusa a leitura e acende o alerta. */
        var vistos = {};
        novos.forEach(function(l){ vistos[l.id] = 1; });
        var atuais = estado.lancamentos.filter(function(l){ return l.origem === "csv"; });
        var perdidos = atuais.filter(function(l){ return !vistos[l.id]; }).length;
        if(atuais.length >= 20 && perdidos > atuais.length * 0.3){
          throw new Error("a planilha veio com " + perdidos + " receitas a menos — leitura recusada");
        }
        csvOk = true; csvUltima = Date.now(); csvQtd = novos.length; csvStatus = "";
        var saida = casarComPlanilha(novos);
        if(saida) salvar(saida); else render();
      })
      .catch(function(e){
        csvOk = false;
        csvStatus = String((e && e.message) || e);
        render();
      });
  }
  /* a leitura pode "dar certo" e mesmo assim parar de acontecer: aba de fundo
     estrangulada pelo Chrome, timer congelado, máquina suspensa. Aí a TV segue
     confiante mostrando o número de ontem, que é o pior desfecho possível. */
  function planilhaVelha(){
    return !!(CONFIG.CSV_RECEITAS && csvUltima && Date.now() - csvUltima > 20 * 60 * 1000);
  }
  function statusPlanilha(){
    if(!CONFIG.CSV_RECEITAS) return "";
    if(!csvOk) return " &middot; planilha não lida" + (csvStatus ? " (" + esc(csvStatus) + ")" : "");
    var p = partesSP(new Date(csvUltima));
    return " &middot; " + plural(csvQtd, "receita lida", "receitas lidas")
      + " da planilha às " + pad(p.h) + ":" + pad(p.m);
  }
  /* ====== a receber (a carteira) ======
     Segunda aba publicada, lida à parte da primeira. A conciliação só sabe de
     dinheiro que já caiu; quanto ainda vem é outra lista — o que está emitido
     e ainda não entrou, com data de vencimento.

     As duas leituras são independentes de propósito: a carteira falhar não
     pode derrubar o realizado, que é o número que manda na tela. E ela não vai
     para o localStorage: carteira velha guardada seria uma promessa de dinheiro
     que talvez já tenha caído — se não foi lida agora, o painel não a mostra. */
  var carStatus = "", carOk = false, carUltima = 0, carQtd = 0, carLista = [];
  /* status que dizem "não conte mais": ou o título caiu — e aí ele já está na
     conciliação, e somar dos dois lados dobraria a receita — ou ele morreu */
  var BAIXADOS = ["pago","paga","recebido","recebida","baixado","baixada",
                  "liquidado","liquidada","quitado","quitada","cancelado","cancelada"];
  function aReceberDoCSV(txt){
    var linhas = csvLinhas(txt);
    if(linhas.length < 2) return null;
    var col = {};
    linhas[0].forEach(function(nome, i){ var k = chaveCol(nome); if(col[k] === undefined) col[k] = i; });
    function primeira(nomes){
      for(var i = 0; i < nomes.length; i++) if(col[nomes[i]] !== undefined) return col[nomes[i]];
      return undefined;
    }
    /* a coluna da data pode se chamar vencimento, data de vencimento ou data */
    var iData = primeira(["vencimento","datadevencimento","datavencimento","data"]);
    var iValor = primeira(["valor","valorareceber","valordotitulo"]);
    if(iData === undefined || iValor === undefined) return null;
    var iNome = primeira(["nome","cliente","sacado","razaosocial"]);
    var iDesc = primeira(["descricao","historico","documento"]);
    var iStatus = primeira(["status","situacao"]);
    function cel(r, i){ return i === undefined ? "" : String(r[i] || "").trim(); }

    var out = [];
    for(var i = 1; i < linhas.length; i++){
      var r = linhas[i];
      if(iStatus !== undefined && BAIXADOS.indexOf(chaveCol(cel(r, iStatus))) > -1) continue;
      var v = valorPlanilha(cel(r, iValor));
      if(!isFinite(v) || v <= 0) continue;
      var dia = diaPlanilha(cel(r, iData));
      if(!dia) continue;
      out.push({ dia:dia, valor:Math.round(v*100)/100,
                 cliente:cel(r, iNome).slice(0,60), desc:cel(r, iDesc).slice(0,60) });
    }
    return out;
  }
  /* Só o que vence até o fim do mês: é o que ainda pode fazer a meta bater. O
     que venceu e não caiu continua sendo dinheiro a entrar e entra no total,
     mas vai contado à parte na nota — promessa vencida não vale o mesmo que
     promessa no prazo, e quem olha precisa saber a diferença. */
  function carteiraDoMes(d){
    if(!carOk) return null;
    var fim = d.mes + "-" + pad(diasNoMes(d.mes));
    var total = 0, qtd = 0, vencido = 0, qtdVencida = 0;
    carLista.forEach(function(x){
      if(x.dia > fim) return;
      total += x.valor; qtd++;
      if(x.dia < d.hoje){ vencido += x.valor; qtdVencida++; }
    });
    return { total:total, qtd:qtd, vencido:vencido, qtdVencida:qtdVencida,
             ate: pad(diasNoMes(d.mes)) + "/" + d.mes.slice(5,7) };
  }
  function buscarAReceber(){
    if(!CONFIG.CSV_A_RECEBER) return Promise.resolve();
    var u = CONFIG.CSV_A_RECEBER;
    return fetch(u + (u.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(t){
        var lista = aReceberDoCSV(t);
        if(!lista) throw new Error("faltam as colunas de vencimento e valor");
        carLista = lista; carQtd = lista.length;
        carOk = true; carUltima = Date.now(); carStatus = "";
        render();
      })
      .catch(function(e){
        carOk = false;
        carStatus = String((e && e.message) || e);
        render();
      });
  }
  function statusCarteira(){
    if(!CONFIG.CSV_A_RECEBER) return "";
    if(!carOk) return " &middot; carteira não lida" + (carStatus ? " (" + esc(carStatus) + ")" : "");
    var p = partesSP(new Date(carUltima));
    /* "lidos", e não "em aberto no mês": este número é quanto veio da aba, e o
       do quadro é só o que vence até o fim do mês — dois números diferentes
       com o mesmo nome fariam parecer erro */
    return " &middot; " + plural(carQtd, "título lido", "títulos lidos")
      + " da carteira às " + pad(p.h) + ":" + pad(p.m);
  }

  function iniciarPlanilha(){
    if(!CONFIG.CSV_RECEITAS && !CONFIG.CSV_A_RECEBER) return;
    function ler(){ buscarCSV(); buscarAReceber(); }
    ler();
    setInterval(ler, Math.max(CONFIG.CSV_SEGUNDOS || 300, 30) * 1000);
    /* o Chrome estrangula o timer de aba que não está à frente: ao voltar a
       aparecer, relê em vez de confiar no que ficou congelado na tela */
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible") ler();
    });
  }
  /* A TV passa semanas na mesma aba. Sem uma recarga marcada, versão nova do
     painel nunca chega à tela e um erro de render congela tudo até alguém
     subir lá — com o relógio ainda andando, o que faz parecer que está viva. */
  function agendarRecarga(){
    if(!modoTV) return;
    var p = partesSP(), agora = p.h * 60 + p.m, alvo = 3 * 60 + 30;
    var faltam = (agora < alvo ? alvo - agora : 24 * 60 - agora + alvo) * 60000;
    setTimeout(function(){ location.reload(); }, faltam);
  }

  /* ====== fogos e balões ====== */
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d"), anim = 0, parts = [], baloes = [], ultimoFogo = 0, ultimoBalao = 0;
  var CORES = ["#FFCD1C","#FFFFFF","#FF6B8B","#4AD6FF","#7CF58F","#C89BFF","#FFA23A"];
  var reduzido = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function dimensionar(){
    var r = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(innerWidth * r); cv.height = Math.floor(innerHeight * r);
    ctx.setTransform(r,0,0,r,0,0);
  }
  function explodir(x,y,cor){
    var n = 46 + Math.floor(Math.random()*34);
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, v = 1.4 + Math.random()*4.4;
      parts.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, vida:1, dec:0.007+Math.random()*0.01, cor:cor, r:1.9+Math.random()*2.4 });
    }
  }
  function novoBalao(){
    var cor = CORES[Math.floor(Math.random()*CORES.length)];
    baloes.push({ x:40 + Math.random()*(innerWidth-80), y:innerHeight+60, v:0.5+Math.random()*0.9, r:16+Math.random()*16, cor:cor, f:Math.random()*Math.PI*2, amp:12+Math.random()*22 });
  }
  function desenharBalao(b){
    var x = b.x + Math.sin(b.f)*b.amp;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, b.y + b.r*1.25);
    ctx.quadraticCurveTo(x + Math.sin(b.f*2)*8, b.y + b.r*1.25 + 26, x, b.y + b.r*1.25 + 52); ctx.stroke();
    ctx.fillStyle = b.cor; ctx.globalAlpha = .92;
    ctx.beginPath(); ctx.ellipse(x, b.y, b.r*0.82, b.r, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = .35; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(x - b.r*0.28, b.y - b.r*0.34, b.r*0.16, b.r*0.24, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function quadro(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if(t - ultimoFogo > 380 + Math.random()*380){
      ultimoFogo = t;
      explodir(innerWidth*(0.14 + Math.random()*0.72), innerHeight*(0.12 + Math.random()*0.42), CORES[Math.floor(Math.random()*CORES.length)]);
    }
    if(t - ultimoBalao > 700){ ultimoBalao = t; novoBalao(); }
    ctx.shadowBlur = 14;
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.vx *= 0.986; p.vy *= 0.986; p.vida -= p.dec;
      if(p.vida <= 0){ parts.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(p.vida,0); ctx.fillStyle = p.cor; ctx.shadowColor = p.cor;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.4 + p.vida*0.6), 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    for(var j=baloes.length-1;j>=0;j--){
      var b = baloes[j]; b.y -= b.v; b.f += 0.012;
      if(b.y < -140){ baloes.splice(j,1); continue; }
      desenharBalao(b);
    }
    anim = requestAnimationFrame(quadro);
  }
  function iniciarFogos(){
    if(anim) return;
    dimensionar();
    if(reduzido){
      for(var i=0;i<7;i++) desenharBalao({ x:innerWidth*(i+0.5)/7, y:innerHeight*0.7, r:24, cor:CORES[i%CORES.length], f:0, amp:0 });
      return;
    }
    ultimoFogo = 0; ultimoBalao = 0;
    for(var k=0;k<3;k++) explodir(innerWidth*(0.25+k*0.25), innerHeight*(0.2+Math.random()*0.2), CORES[k]);
    for(var n=0;n<7;n++){ novoBalao(); baloes[baloes.length-1].y = innerHeight*(0.35 + n*0.12); }
    anim = requestAnimationFrame(quadro);
  }
  function pararFogos(){
    if(anim){ cancelAnimationFrame(anim); anim = 0; }
    parts = []; baloes = [];
    if(ctx) ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  addEventListener("resize", function(){ if(document.body.classList.contains("festa")) dimensionar(); });

  /* ====== ciclo ====== */
  var salvo = carregarLocal();
  if(salvo){
    /* Do que ficou guardado no navegador, só a última cópia da planilha
       sobrevive — ela serve para a tela não abrir vazia enquanto a leitura não
       chega. Lançamento digitado ou corrigido à mão e a lista de ocultos, de
       quando o painel ainda deixava mexer na receita, ficam para trás: é o que
       conserta sozinho um navegador em que alguém apagou ou alterou linha. A
       primeira leitura da planilha repõe o que tiver sido apagado. */
    estado.lancamentos = salvo.lancamentos.map(normalizar)
      .filter(function(l){ return l && l.origem === "csv"; });
    if(typeof salvo.metaMes === "number" && salvo.metaMes > 0) estado.metaMes = salvo.metaMes;
    if(typeof salvo.custoMes === "number" && salvo.custoMes >= 0) estado.custoMes = salvo.custoMes;
  }
  if(modoTV) document.body.classList.add("tv");
  festaVista = !!festaMes && festaMes === mesDe(hojeSP());
  render();
  iniciarSync();
  iniciarPlanilha();
  agendarRecarga();
  /* na TV os segundos piscam 86.400 vezes por dia sem informar nada, e ainda
     puxam o olho de quem passa: lá o relógio anda de minuto em minuto */
  setInterval(function(){
    var el = document.querySelector(".relogio .hora");
    var p = partesSP();
    if(!el) return;
    el.innerHTML = modoTV ? pad(p.h) + ":" + pad(p.m)
      : pad(p.h) + ":" + pad(p.m) + '<span style="font-size:.55em;color:var(--ink-3)">:' + pad(p.s) + '</span>';
  }, 1000);
  setInterval(render, 30000);
})();
</script>
