<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#092737">
<title>Painel Comercial · Vetor SST</title>
<!--
  Painel de ritmo comercial — Vetor SST
  Meta do mês, quanto falta para bater, ritmo atual e ritmo diário necessário.

  Arquivo único: abra direto no navegador ou suba em qualquer hospedagem
  estática. Publicado em https://vetorsst.github.io/painel-diario/
  Configuração no início da tag <script> lá embaixo: procure por "var CONFIG".
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --ground:#041720;
  --navy:#092737;
  --card:#0b2b3b;
  --card-hi:#103a4f;
  --line:rgba(255,255,255,.09);
  --line-forte:rgba(255,255,255,.16);
  --ink:#eaf3f7;
  --ink-2:#a2bcc9;
  --ink-3:#6f8d9c;
  --amarelo:#FFCD1C;
  --amarelo-esc:#c99e0f;
  --ok:#3ad29b;
  --alerta:#ff7d63;
  --r:14px;
}
body{
  background:
    radial-gradient(1200px 700px at 78% -12%, #0e3a4e 0%, transparent 60%),
    radial-gradient(900px 600px at 8% 0%, rgba(255,205,28,.07) 0%, transparent 55%),
    var(--ground);
  color:var(--ink);
  font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:1520px;margin:0 auto;padding:clamp(14px,2.2vw,30px) clamp(14px,2.4vw,34px) 48px}
.rot{margin:0;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:14px}
/* o PNG da marca traz margem morta em volta: a arte ocupa 1649x504 dentro de
   2546x1215. A janela recorta e a imagem é posicionada dentro dela, então o
   arquivo original segue intocado e serve para qualquer outro uso. */
.marca-vetor{position:relative;overflow:hidden;display:block;flex:none;width:150px;aspect-ratio:1649/504}
.marca-vetor img{position:absolute;display:block;width:154.4%;left:-28.56%;top:-70.44%}
.logo .kicker{font-size:.58rem;line-height:1.35;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-left:14px;border-left:1px solid var(--line-forte)}
.relogio{display:flex;align-items:baseline;gap:14px}
.relogio .hora{font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:700;letter-spacing:-.01em;line-height:1}
.relogio .dia{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- hero ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap;padding:clamp(20px,3vw,34px) 0 14px}
.big{margin:2px 0 0;font-size:clamp(3.4rem,11.5vw,8.6rem);font-weight:900;letter-spacing:-.045em;line-height:.86;color:var(--amarelo);font-variant-numeric:tabular-nums}
.big.zerado{color:var(--ink)}
.sub{margin:10px 0 0;font-size:clamp(.85rem,1.5vw,1.05rem);color:var(--ink-2);font-weight:400}
.sub b{color:var(--ink);font-weight:700}
.hero-dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:rgba(58,210,155,.35);background:rgba(58,210,155,.1)}
.pill.at{color:var(--amarelo);border-color:rgba(255,205,28,.35);background:rgba(255,205,28,.1)}
.pill.ruim{color:var(--alerta);border-color:rgba(255,125,99,.35);background:rgba(255,125,99,.1)}
.pill.neutro{color:var(--ink-2);border-color:var(--line-forte);background:rgba(255,255,255,.04)}
.hero-dir .nota{margin:0;font-size:.82rem;color:var(--ink-3)}
.hero-dir .nota b{color:var(--ink-2);font-weight:600}

/* ---------- barra ---------- */
/* o rótulo do marcador sobe 19px do trilho e batia no "de R$ 250.000 · 1,5%"
   logo acima — no primeiro dia útil do mês os dois caem no mesmo ponto */
.barra{margin-top:6px}
body:not(.tv) .barra{margin-top:26px}
.track{position:relative;height:22px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:visible}
.fill{position:absolute;inset:1px auto 1px 1px;border-radius:10px;background:linear-gradient(90deg,var(--amarelo-esc),var(--amarelo));transition:width .6s cubic-bezier(.2,.7,.3,1);min-width:0}
.marca{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink);border-radius:2px;transition:left .6s cubic-bezier(.2,.7,.3,1)}
.marca span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.ticks{display:flex;justify-content:space-between;margin-top:9px;font-size:.62rem;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px}
.kpi .val{margin:8px 0 0;font-size:clamp(1.35rem,2.6vw,2rem);font-weight:800;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val.acc{color:var(--amarelo)}
.kpi .nota{margin:7px 0 0;font-size:.72rem;color:var(--ink-3)}
.kpi.destaque{background:linear-gradient(160deg,rgba(255,205,28,.14),rgba(255,205,28,.03));border-color:rgba(255,205,28,.28)}

/* ---------- projeção do mês ---------- */
/* título no topo e números embaixo, como os outros quadros do painel: com o
   título numa coluna própria as três colunas não liam como uma linha só */
.projecao{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.proj-cab{grid-column:1/-1}
.projecao h3{margin:0 0 2px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.projecao .legenda{margin:0;font-size:.72rem;color:var(--ink-3)}
/* com a carteira lida são quatro números, não três */
.projecao.com-carteira{grid-template-columns:repeat(4,minmax(0,1fr))}
.proj-num .val{margin:8px 0 0;font-size:clamp(1.35rem,2.6vw,2rem);font-weight:800;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.proj-num .val.acc{color:var(--amarelo)}
.proj-num .val.pos{color:var(--ok)}
.proj-num .val.neg{color:var(--alerta)}
.proj-num .nota{margin:7px 0 0;font-size:.72rem;color:var(--ink-3)}
.proj-conta{grid-column:1/-1;margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- grid principal ---------- */
.colunas{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;margin-top:12px;align-items:start}
.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.painel h3{margin:0 0 2px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.painel .legenda{margin:0 0 14px;font-size:.72rem;color:var(--ink-3)}

/* form */
.lanc{display:flex;flex-direction:column;gap:10px}
.campo{position:relative}
.campo input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line-forte);border-radius:10px;color:var(--ink);font:inherit;font-size:1rem;padding:12px 14px}
.campo input::placeholder{color:var(--ink-3);font-weight:400;letter-spacing:0}
.campo input:focus{outline:2px solid var(--amarelo);outline-offset:1px;border-color:transparent}
.btn:focus-visible,.btn-ghost:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.btn{background:var(--amarelo);color:#04151d;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-size:.92rem;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.aviso{margin:0;font-size:.74rem;color:var(--alerta);min-height:1em}
.aviso.ok{color:var(--ok)}

/* listas */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lista li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.86rem}
.lista li:first-child{border-top:0}
.lista .qtd{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lista .quem{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .quando{color:var(--ink-3);font-size:.74rem;font-variant-numeric:tabular-nums;flex:none}
.vazio{margin:6px 0 0;font-size:.8rem;color:var(--ink-3)}
.rodape{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.7rem;color:var(--ink-3);letter-spacing:.04em}

/* ---------- meta do mês ---------- */
.sub .metaval{color:var(--amarelo);font-weight:800}
.metas-form .link{align-self:flex-start;padding:7px 14px}
.meta-atual{margin:0;font-size:.72rem;color:var(--ink-3)}

/* ---------- editar lançamento ---------- */

/* ---------- histórico ---------- */
.acoes-topo{display:flex;align-items:center;gap:10px}
.link{background:rgba(255,255,255,.05);border:1px solid var(--line-forte);color:var(--ink-2);border-radius:999px;padding:9px 16px;font:inherit;font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:.15s}
.link:hover{color:var(--ink);border-color:var(--ink-3)}
.link.forte{background:var(--amarelo);border-color:var(--amarelo);color:#04151d}
.link:disabled{opacity:.5;cursor:progress}
.link:disabled:hover{color:var(--ink-2);border-color:var(--line-forte)}
.hist-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:26px 0 18px}
.hist-topo h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.03em}
.hist-topo p{margin:6px 0 0;font-size:.84rem;color:var(--ink-3)}
.resumo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.busca{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.busca input{flex:1;min-width:220px;background:rgba(255,255,255,.05);border:1px solid var(--line-forte);border-radius:10px;color:var(--ink);font:inherit;font-size:.9rem;padding:11px 14px}
.busca input:focus{outline:2px solid var(--amarelo);outline-offset:1px;border-color:transparent}
.busca input::placeholder{color:var(--ink-3)}
.dia{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dia.batido{border-color:rgba(255,205,28,.32)}
.dia-cab{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:15px 18px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.dia-cab:hover{background:rgba(255,255,255,.03)}
.dia-cab .data{font-size:.95rem;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px}
.dia-cab .seta{color:var(--ink-3);font-size:.7rem;transition:transform .2s}
.dia.aberto .seta{transform:rotate(90deg)}
.dia-cab .tot{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.dia.batido .dia-cab .tot{color:var(--amarelo)}
.dia-cab .meta-info{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:.72rem;color:var(--ink-3);margin-top:2px}
.dia-cab .db{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;min-width:60px}
.dia-cab .db i{display:block;height:100%;background:var(--amarelo-esc);border-radius:3px}
.dia.batido .db i{background:var(--amarelo)}
.selo{font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#04151d;background:var(--amarelo);border-radius:999px;padding:3px 9px}
.dia-corpo{padding:0 18px 8px}
.hist-linha{display:grid;grid-template-columns:56px 1fr 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.86rem}
.hist-linha .hora{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:.78rem}
.hist-linha .quem{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-linha .quem b{color:var(--ink);font-weight:600}
.hist-linha .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sem-resultado{margin:26px 0;text-align:center;color:var(--ink-3);font-size:.88rem}

/* banner meta batida */
.banner{width:100%;margin:0 0 14px;border:1px solid rgba(255,205,28,.4);background:linear-gradient(90deg,rgba(255,205,28,.2),rgba(255,205,28,.05));color:var(--amarelo);border-radius:12px;padding:13px 18px;font:inherit;font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left}
.banner:hover{background:rgba(255,205,28,.24)}

/* ---------- acabamento: o material dos cartões ----------
   O painel era chapado — cartão, borda de 1px e mais nada. Aqui ele ganha a
   matéria que faz uma tela parecer instrumento: luz vinda de cima, sombra por
   baixo e um fio de brilho na aresta superior. Tudo somado ao mesmo token de
   cor, então o contraste do texto não muda. */
.kpi,.painel,.projecao,.dia{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 44%),var(--card);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 18px 38px -28px rgba(0,0,0,.95);
}
.kpi,.painel,.projecao{position:relative}
/* o fio não vai de ponta a ponta: recuado e esmaecido nas pontas, acompanha o
   canto arredondado sem precisar de overflow:hidden — que cortaria a dica do
   gráfico ao passar o mouse */
.kpi::after,.painel::after,.projecao::after{
  content:"";position:absolute;top:0;left:12px;right:12px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2) 20%,rgba(255,255,255,.05) 60%,transparent);
}
.kpi.destaque::after{background:linear-gradient(90deg,transparent,rgba(255,205,28,.6) 20%,rgba(255,205,28,.12) 60%,transparent)}
.kpi.destaque{box-shadow:inset 0 1px 0 rgba(255,205,28,.25),0 18px 38px -28px rgba(0,0,0,.95)}

/* malha fina ao fundo, no limite do perceptível: dá textura de instrumento sem
   disputar com o texto. Some na TV — grade de 1px a quatro metros vira moiré. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(130% 95% at 50% 0%,#000 28%,transparent 76%);
  mask-image:radial-gradient(130% 95% at 50% 0%,#000 28%,transparent 76%);
}
body.tv::before{display:none}

/* a barra do mês vira instrumento: décimos marcados no trilho, para o olho ter
   régua, e o preenchimento aceso */
body:not(.tv) .track{
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.11) calc(10% - 1px) 10%),
    rgba(255,255,255,.05);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
}
body:not(.tv) .fill{box-shadow:0 0 18px rgba(255,205,28,.32),inset 0 1px 0 rgba(255,255,255,.3)}
body:not(.tv) .marca{box-shadow:0 0 10px rgba(255,255,255,.4)}
body:not(.tv) .big{text-shadow:0 0 70px rgba(255,205,28,.22)}
/* o ponto da tarja pulsa como um LED de estado — no computador, onde alguém
   está perto. Na TV ficaria piscando a noite inteira para ninguém. */
@media (prefers-reduced-motion:no-preference){
  body:not(.tv) .pill::before{animation:led 2.6s ease-in-out infinite}
}
@keyframes led{0%,100%{opacity:1;box-shadow:0 0 7px currentColor}50%{opacity:.45;box-shadow:0 0 0 currentColor}}

/* ---------- gráfico do mês, dia a dia ----------
   Série única, então nenhuma legenda: o subtítulo diz o que está plotado. A
   coluna é fina e sobra ar na faixa, o topo é arredondado e a base quadrada na
   linha de base. A vista em tabela da mesma informação é a tela de Histórico. */
.g-plot{position:relative;display:flex;align-items:flex-end;gap:2px;height:118px;margin-top:26px}
/* linha de referência: fio sólido, nunca tracejado — tracejo é ruído e aqui a
   legenda já diz o que a linha marca */
.g-alvo{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.26);pointer-events:none}
.g-band{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.g-band:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.g-bar{width:min(14px,100%);border-radius:4px 4px 0 0;background:var(--amarelo);transition:height .5s cubic-bezier(.2,.7,.3,1)}
/* dia útil que passou sem nada e dia que ainda não chegou não são a mesma
   coisa: o primeiro é um zero, o segundo é uma coluna que ainda vai existir */
.g-bar.zero{min-height:2px;background:rgba(255,255,255,.16)}
.g-bar.futuro{min-height:2px;background:rgba(255,255,255,.12)}
.g-band.hoje .g-bar{box-shadow:0 0 14px rgba(255,205,28,.5)}
.g-max{position:absolute;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.g-band::after{
  content:attr(data-dica);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  white-space:nowrap;background:#04151d;border:1px solid var(--line-forte);border-radius:8px;
  padding:6px 9px;font-size:.72rem;color:var(--ink);opacity:0;pointer-events:none;
  transition:opacity .12s;z-index:6;font-variant-numeric:tabular-nums;
}
.g-band:hover::after,.g-band:focus-visible::after{opacity:1}
/* a dica nasce centrada na coluna; nas pontas isso a jogava para fora da tela
   e alargava a página inteira no celular — 533px de conteúdo em 477 de tela.
   Nas três de cada ponta ela ancora pela borda. A linha de referência é o
   último filho justamente para não entrar nesta contagem. */
.g-band:nth-child(-n+3)::after{left:0;transform:none}
.g-band:nth-last-child(-n+4)::after{left:auto;right:0;transform:none}
.g-eixo{display:flex;gap:2px;margin-top:8px;font-size:.58rem;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.g-eixo span{flex:1;min-width:0;text-align:center}
.g-eixo .hoje{color:var(--amarelo);font-weight:700}

/* ---------- modo TV (?tv) ----------
   Tela de parede: ninguém clica, ninguém chega perto. Tudo é lido de 3 a 6
   metros, então os tamanhos saem de vw — a TV é 16:9 e a largura manda. */
/* TODA medida sai de --u. Em 16:9 exato 1vw e 1,78vh valem o mesmo, então a TV
   cheia fica idêntica ao desenhado; numa janela mais baixa o vh assume e a
   composição encolhe em bloco, em proporção. Antes as fontes vinham de vw e os
   espaços de vh: em janela baixa o texto continuava grande, o respiro sumia, e
   a lista — único bloco elástico — absorvia todo o déficit e ficava com duas
   linhas. Era esse o "tá feio". */
/* Numa TV de escritório (gama ~2,4, black crush agressivo) as diferenças sutis
   somem: o cartão contra o fundo dava 1,24:1 e a borda 1,31:1 — a 4 metros
   nenhum dos dois existia. Aqui o painel troca sutileza por separação real. */
body.tv{overflow:hidden}
.tv{--u:min(1vw,1.7778vh);--card:#12384c;--line:rgba(255,255,255,.22);--line-forte:rgba(255,255,255,.3);--ink-3:#93aebc}
/* o degradê do preenchimento lê como "a barra está apagando" de longe */
/* altura fixa, não mínima: com min-height a lista empurrava o rodapé para fora
   da tela, e numa TV o que passa da dobra simplesmente não existe */
.tv .wrap{max-width:none;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:calc(1.4*var(--u)) calc(2.6*var(--u)) calc(1*var(--u))}
.tv .topo{padding-bottom:calc(.85*var(--u))}
.tv .marca-vetor{width:max(150px,calc(11.5*var(--u)))}
.tv .logo{gap:max(14px,calc(1.3*var(--u)))}
.tv .logo .kicker{font-size:max(9px,calc(1.15*var(--u)));padding-left:max(14px,calc(1.3*var(--u)));line-height:1.35}
/* Burn-in: o número muda, mas o logo amarelo e os rótulos ocupam os mesmos
   pixels por semanas. Um passeio de poucos pixels ao longo de meia hora não se
   percebe de longe e quebra a permanência da imagem. */
@media (prefers-reduced-motion: no-preference){
  .tv .wrap{animation:passeio 1800s linear infinite}
}
@keyframes passeio{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(3px,2px)}
  50%{transform:translate(-2px,3px)}
  75%{transform:translate(2px,-3px)}
}
.tv .relogio .hora{font-size:max(26px,calc(3.5*var(--u)));font-weight:700}
.tv .relogio .dia{font-size:max(11px,calc(1.45*var(--u)))}

/* Escala em sete degraus, todos >= 1,24x. Antes eram doze tamanhos, dez deles
   apertados numa faixa de 1,8x — diferença de 3% não lê como hierarquia, lê
   como desalinhamento. */
.tv-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(3*var(--u));padding:calc(.85*var(--u)) 0 calc(.5*var(--u))}
.tv-hero .rot{font-size:max(11px,calc(1.45*var(--u)));letter-spacing:.18em;line-height:1.1}
/* peso 800, não 900: amarelo saturado sobre azul escuro na gama de uma TV
   engorda opticamente e a contraforma borra — o número parecia pastoso.
   O -.055em de margem corrige a sidebearing do "R" do Poppins Black, que
   deixava o número recuado em relação ao rótulo acima dele. */
.tv-big{margin:calc(.3*var(--u)) 0 0 -.055em;font-size:max(56px,calc(8.4*var(--u)));font-weight:800;letter-spacing:-.035em;line-height:.84;color:var(--amarelo);font-variant-numeric:tabular-nums}
.tv-big.zerado{color:var(--ink)}
.tv-sub{margin:calc(.55*var(--u)) 0 0;font-size:max(15px,calc(2.35*var(--u)));color:var(--ink-2);font-weight:400;line-height:1.25}
.tv-sub b{color:var(--ink);font-weight:700}
.tv-dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:calc(.8*var(--u));padding-bottom:calc(.5*var(--u));flex:none}
.tv .pill{font-size:max(12px,calc(1.8*var(--u)));padding:calc(.55*var(--u)) calc(1.3*var(--u));letter-spacing:.1em}
.tv .pill::before{width:max(8px,calc(.75*var(--u)));height:max(8px,calc(.75*var(--u)))}
.tv-dir .nota{margin:0;font-size:max(12px,calc(1.45*var(--u)));line-height:1.3}
.tv-dir .nota b{color:var(--ink-2);font-weight:700}

.tv .track{height:max(16px,calc(1.5*var(--u)));border-radius:999px}
/* o marcador de 2px do painel dá 1,3 mm numa TV de 55" — invisível */
.tv .marca{width:max(4px,calc(.4*var(--u)));top:calc(-.4*var(--u));bottom:calc(-.4*var(--u));border-radius:999px;background:var(--ink-2)}
.tv .marca span{top:calc(100% + .45*var(--u));bottom:auto;font-size:max(9px,calc(1.15*var(--u)));letter-spacing:.18em}
/* amarelo chapado: o degradê perde 40% de contraste na ponta esquerda e, na
   gama de uma TV, a barra parece estar apagando em vez de cheia */
.tv .fill{border-radius:999px;background:var(--amarelo)}
.tv .ticks{font-size:max(10px,calc(1.15*var(--u)));margin-top:calc(.5*var(--u));letter-spacing:.18em}

/* ---- corpo: a lista manda, o mês acompanha ----
   minmax(0,...) não é enfeite: sem ele um item de grade tem min-width:auto e
   "Consultorio de Neurologia Dra Denise Leal" estoura a coluna. */
.tv-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:calc(1.1*var(--u));margin-top:calc(1.1*var(--u))}
.tv-lista,.tv-lado .bloco{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.tv-lista{min-height:0;overflow:hidden;padding:calc(1.2*var(--u)) calc(1.5*var(--u));display:flex;flex-direction:column}
.tv-lista h3{margin:0 0 calc(.7*var(--u));display:flex;justify-content:space-between;align-items:baseline;gap:calc(1*var(--u));font-size:max(10px,calc(1.45*var(--u)));font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);line-height:1.1}
.tv-lista h3 .conta{font-weight:600;letter-spacing:.06em;text-transform:none;color:var(--ink-3);flex:none}
.tv-linhas{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
/* zebra no lugar do filete: rgba(255,255,255,.06) simplesmente não existe a 4m */
.tv-linha{flex:none;display:flex;align-items:baseline;gap:calc(1.1*var(--u));padding:calc(.5*var(--u)) calc(.6*var(--u));margin-inline:calc(-.6*var(--u));border-radius:calc(.3*var(--u));font-size:max(14px,calc(2.05*var(--u)));line-height:1.15}
/* display:flex é regra de autor e vence o [hidden] da folha do navegador: sem
   esta linha, ajustarLista() marca a linha como escondida e ela desenha assim
   mesmo, cortada pelo overflow */
.tv-linha[hidden]{display:none}
.tv-linha:nth-child(even){background:rgba(255,255,255,.032)}
.tv-linha .quando{font-size:.72em;font-variant-numeric:tabular-nums;flex:none;min-width:4.2em}
.tv-linha .quem{flex:1;min-width:0;color:var(--ink);font-weight:600;letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-linha .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--amarelo);flex:none}
.tv-linha .cent{font-size:.68em;color:rgba(255,205,28,.62);letter-spacing:0}
.tv-lista .vazio{font-size:max(13px,calc(1.8*var(--u)))}

/* linhas iguais: com altura automática os blocos viravam cartões achatados
   quando sobra altura numa TV cheia */
.tv-lado{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:calc(.85*var(--u));min-height:0;overflow:hidden}
.tv-lado .bloco{display:flex;flex-direction:column;justify-content:center;padding:calc(.55*var(--u)) calc(1.2*var(--u));min-height:0;overflow:hidden}
/* um só bloco em destaque, como o painel de computador faz */
.tv-lado .bloco.destaque{background:linear-gradient(160deg,rgba(255,205,28,.15),rgba(255,205,28,.03));border-color:rgba(255,205,28,.3)}
.tv-lado .rot{font-size:max(10px,calc(1.32*var(--u)));line-height:1.1}
.tv-lado .val{margin:calc(.35*var(--u)) 0 0;font-size:max(20px,calc(2.95*var(--u)));font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tv-lado .val.acc{color:var(--amarelo)}
.tv-lado .nota{margin:calc(.35*var(--u)) 0 0;font-size:max(11px,calc(1.35*var(--u)));line-height:1.25}
.tv-lado .nota b{color:var(--ink);font-weight:700}

.tv-alerta{margin-top:calc(.9*var(--u));border:1px solid rgba(255,125,99,.5);background:rgba(255,125,99,.14);color:var(--alerta);border-radius:12px;padding:calc(.7*var(--u)) calc(1.4*var(--u));font-size:max(14px,calc(2.05*var(--u)));font-weight:700;letter-spacing:.02em}
.tv .rodape{margin-top:calc(.7*var(--u));font-size:max(10px,calc(1.45*var(--u)))}
/* na TV, rótulo cinza-claro some: --ink-3 dá 4,19:1 sobre o card, abaixo do
   mínimo legível. Tudo que é rótulo sobe um nível de contraste. */
.tv .rot,.tv .nota,.tv .ticks,.tv .rodape,.tv .vazio,.tv-linha .quando{color:var(--ink-2)}
/* na TV ninguém clica: o botão de sair da festa não tem serventia */
.tv .btn-ghost{display:none}
.tv .party-title{font-size:max(48px,calc(10*var(--u)))}
/* rótulo fino sobre fundo escuro perde peso aparente: sobe de 600 para 700 */
.tv .rot,.tv-lista h3{font-weight:700}

/* ---------- acabamento da TV ----------
   A 4 metros um fio de 1px não existe, então aqui o ganho tem de ser de massa:
   um degradê curto no cartão e o preenchimento da barra aceso. Nada que mexa no
   contraste para o qual o modo TV foi calibrado — o cartão continua chapado na
   parte de baixo, onde o texto mora. */
.tv-lista,.tv-lado .bloco{
  background:linear-gradient(180deg,#143d53,var(--card) 62%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 22px 46px -32px #000;
}
.tv-lado .bloco.destaque{background:linear-gradient(160deg,rgba(255,205,28,.18),rgba(255,205,28,.03))}
.tv .track{box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.tv .fill{box-shadow:0 0 calc(1.8*var(--u)) rgba(255,205,28,.5)}
.tv .marca{box-shadow:0 0 calc(.9*var(--u)) rgba(255,255,255,.5)}

/* ---------- festa ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:78;display:none}
body.festa #fx{display:block}
.party-bg{position:fixed;inset:0;z-index:75;
  background:radial-gradient(circle at 50% 45%,rgba(9,39,55,.88) 0%,rgba(4,23,32,.97) 55%,rgba(4,23,32,.995) 100%)}
.party{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;pointer-events:none}
.party>*{pointer-events:auto}
.party-kicker{margin:0;font-size:clamp(.66rem,1.5vw,.82rem);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2)}
.party-title{margin:0;font-size:clamp(2.6rem,11vw,8rem);font-weight:900;line-height:.86;letter-spacing:-.04em;color:var(--amarelo);
  text-shadow:0 0 42px rgba(255,205,28,.45);animation:pulsa 1.15s ease-in-out infinite alternate}
.party-sub{margin:2px 0 0;font-size:clamp(1rem,2.6vw,1.7rem);font-weight:700;color:var(--ink)}
.party-sub span{color:var(--amarelo)}
.btn-ghost{margin-top:12px;background:rgba(255,255,255,.06);border:1px solid var(--line-forte);color:var(--ink-2);border-radius:999px;padding:11px 22px;font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-3)}
@keyframes pulsa{from{transform:scale(1)}to{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){
  .party-title{animation:none}
  .fill,.marca,.hbar i{transition:none}
}
@media (max-width:1080px){
  .colunas{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .resumo{grid-template-columns:repeat(2,1fr)}
  .projecao.com-carteira{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .projecao,.projecao.com-carteira{grid-template-columns:1fr}
  .hero-dir{align-items:flex-start;text-align:left}
  .ticks span:nth-child(even){visibility:hidden}
  .resumo{grid-template-columns:1fr 1fr;gap:8px}
  .hist-linha{grid-template-columns:48px 1fr 96px;gap:8px}
}
